        from:fState.from,fromGolfer:fState.fromGolfer,
        to:fState.to,toGolfer:fState.toGolfer,
        amount:fState.amount,type:fState.type,
        deadline:fState.deadline||null,
        status:'pending',createdAt:Date.now()
      });
      saveState();render();
    },ready?'primary full':'full');
    subBtn.disabled=!ready;
    formContainer.appendChild(subBtn);
  }
  rebuildForm();
  app.appendChild(form);
}

function renderMoney(app){
  var g=state.games;
  var activeGames=Object.keys(g).filter(function(k){return g[k].enabled;});
  if(!activeGames.length){
    app.appendChild(el('p',{class:'small-muted',text:'No games are currently active. Enable games in Setup to see money positions.'}));
    return;
  }

  // ── Compute game winners ──
  // Low score
  var lsResults=g.lowScore&&g.lowScore.enabled?teamResults().filter(function(r){return r.total!==null;}):[];
  lsResults.sort(function(a,b){return a.total-b.total;});
  var lsWinners=lsResults.length?lsResults.filter(function(r){return r.total===lsResults[0].total;}).map(function(r){return r.player;}):[]; 

  // Leader
  var allScored=Object.keys(liveScores).map(function(k){return{key:k,score:liveScores[k]};}).sort(function(a,b){return a.score-b.score;});
  var tlKey=allScored.length?allScored[0].key:null;
  var leaderWinners=g.leader&&g.leader.enabled&&tlKey?state.players.filter(function(p){return state.picks.some(function(pk){return pk.player===p&&normName(pk.golfer)===tlKey&&!isCut(pk.golfer);});}):[];

  // Best ball
  var bbResults=[];
  if(g.bestBall&&g.bestBall.enabled){
    var bbOptedIn=getGameParticipants('bestBall');
    bbResults=bbOptedIn.map(function(p){var r=computeBestBallTotal(p);return{player:p,result:r,total:r?r.total:null};}).filter(function(x){return x.total!==null;});
    bbResults.sort(function(a,b){return a.total-b.total;});
  }
  var bbWinners=bbResults.length?bbResults.filter(function(r){return r.total===bbResults[0].total;}).map(function(r){return r.player;}):[]; 

  // Points
  var ptResults=[];
  if(g.points&&g.points.enabled){
    ptResults=state.players.map(function(p){return{player:p,total:computePointsScore(p)||0};});
    ptResults.sort(function(a,b){return b.total-a.total;}); // higher points = better
  }
  var ptWinners=ptResults.length?ptResults.filter(function(r){return r.total===ptResults[0].total&&r.total>0;}).map(function(r){return r.player;}):[]; 

  // ── Games summary card ──
  var hcard=el('div',{class:'money-card'});
  hcard.appendChild(el('label',{class:'money-pot-label',text:'Active games'}));
  var gameDefs=[
    {key:'lowScore',label:'Low Team Score',winners:lsWinners},
    {key:'leader',label:'Tournament Leader',winners:leaderWinners},
    {key:'bestBall',label:'Best Ball',winners:bbWinners},
    {key:'points',label:'Points Leaderboard',winners:ptWinners}
  ];
  // "Total per player" varies per person depending on opt-ins — show the pool totals instead
  var totalPool=0;
  gameDefs.forEach(function(d){
    if(!g[d.key]||!g[d.key].enabled) return;
    var parts=getGameParticipants(d.key);
    var pot=g[d.key].wager*parts.length;
    totalPool+=pot;
    var row=el('div',{class:'money-row'});
    var left=el('div');
    left.appendChild(el('div',{text:d.label,style:'font-size:14.5px'}));
    var subParts=parts.length<state.numPlayers?
      parts.length+' of '+state.numPlayers+' players \u00b7 ':
      '';
    left.appendChild(el('div',{class:'small-muted',style:'font-size:12px',
      text:subParts+(d.winners.length?'Leading: '+d.winners.join(' & '):'No leader yet')}));
    row.appendChild(left);
    row.appendChild(el('span',{class:'money-amount neutral',text:'$'+pot}));
    hcard.appendChild(row);
  });
  var totRow=el('div',{class:'money-row',style:'border-top:2px solid var(--line);margin-top:4px;padding-top:10px'});
  totRow.appendChild(el('span',{style:'font-weight:600',text:'Total pool'}));
  totRow.appendChild(el('span',{class:'money-amount neutral',style:'font-weight:600',text:'$'+totalPool}));
  hcard.appendChild(totRow);
  hcard.appendChild(el('p',{class:'money-split-note',text:'Pot sizes reflect only opted-in players. Check the Queue tab to update your opt-ins before the draft starts.'}));
  app.appendChild(hcard);

  // ── Per player breakdown ──
  // Build net per player across all games
  var summary=state.players.map(function(p){
    var paid=activeGames.reduce(function(s,k){
      var parts=getGameParticipants(k);
      return s+(parts.indexOf(p)>-1?g[k].wager:0);
    },0);
    var lines=[];
    var net=-paid;
    lines.push({label:'Total wagered',val:'-$'+paid,col:'var(--ink-soft)'});

    function addGame(winners,gameKey,label){
      if(!g[gameKey]||!g[gameKey].enabled) return;
      var parts=getGameParticipants(gameKey);
      if(parts.indexOf(p)===-1){
        // Not opted in — they never paid a stake, nothing to add back
        lines.push({label:label+' (not opted in)',val:'\u2014',col:'var(--ink-soft)'});
        return;
      }
      var pot=g[gameKey].wager*parts.length;
      if(!winners.length){
        // No winner yet — stake held, net neutral (refund temporarily)
        net+=g[gameKey].wager;
        lines.push({label:label+' (in progress \u2014 stake held)',val:'\u00b10',col:'var(--ink-soft)'});
      }else{
        // Only opted-in players can win
        var eligible=winners.filter(function(w){return parts.indexOf(w)>-1;});
        if(eligible.indexOf(p)>-1){
          var share=eligible.length?pot/eligible.length:0;
          net+=share;
          lines.push({label:label+(eligible.length>1?' (split)':''),val:'+$'+share.toFixed(0),col:'#1a5c2e'});
        }else{
          lines.push({label:label,val:'-$'+g[gameKey].wager,col:'#b0413e'});
        }
      }
    }
    addGame(lsWinners,'lowScore','Low Team Score');
    addGame(leaderWinners,'leader','Tournament Leader');
    if(g.bestBall&&g.bestBall.enabled){
      var myBB=bbResults.find(function(r){return r.player===p;});
      var bbDisp=myBB&&myBB.total!==null?'('+myBB.total+' strokes)':'(no data yet)';
      addGame(bbWinners,'bestBall','Best Ball '+bbDisp);
    }
    if(g.points&&g.points.enabled){
      var myPts=ptResults.find(function(r){return r.player===p;});
      var ptDisp=myPts?'('+myPts.total+' pts)':'(0 pts)';
      addGame(ptWinners,'points','Points '+ptDisp);
    }
    // Side bets — proper accounting: stake is at risk, winner gets own back + opponent's
    var activeChallenges=(state.challenges||[]).filter(function(c){return c.status==='active';});
    var myBets=activeChallenges.filter(function(c){return c.from===p||c.to===p;});
    var sideNet=0;
    myBets.forEach(function(ch){
      var leader=getBetLeader(ch);
      var iAmFrom=ch.from===p;
      var iWin=(leader==='from'&&iAmFrom)||(leader==='to'&&!iAmFrom);
      var iLose=(leader==='from'&&!iAmFrom)||(leader==='to'&&iAmFrom);
      var push=leader==='push';
      var opp=iAmFrom?ch.to:ch.from;
      var myG=iAmFrom?ch.fromGolfer:ch.toGolfer;
      var theirG=iAmFrom?ch.toGolfer:ch.fromGolfer;
      var settled=!!ch.winner;
      if(iWin){
        // Win: profit = opponent's stake (own stake returned, net gain = ch.amount)
        sideNet+=ch.amount;
        lines.push({label:(settled?'\u2714 ':'')+'Won vs '+opp+' ('+myG+' v '+theirG+')',val:'+$'+ch.amount,col:'#1a5c2e'});
      }else if(iLose){
        // Lose: lose own stake
        sideNet-=ch.amount;
        lines.push({label:(settled?'\u2714 ':'')+'Lost vs '+opp+' ('+myG+' v '+theirG+')',val:'-$'+ch.amount,col:'#b0413e'});
      }else if(push){
        lines.push({label:'\u2714 Push vs '+opp,val:'$0',col:'var(--ink-soft)'});
      }else{
        // In progress — stake at risk
        lines.push({label:'In play vs '+opp+' ('+myG+' v '+theirG+')',val:'$'+ch.amount+' at risk',col:'var(--ink-soft)'});
      }
    });
    if(myBets.length){
      if(sideNet!==0){
        lines.push({label:'Side bets net',val:(sideNet>=0?'+':'')+'\$'+sideNet,col:sideNet>0?'#1a5c2e':'#b0413e'});
      }
      net+=sideNet;
    }
    return{player:p,net:net,lines:lines};
  });

  app.appendChild(el('label',{class:'field-label',text:'Current money position',style:'display:block;margin:14px 2px 8px'}));
  summary.sort(function(a,b){return b.net-a.net;});
  summary.forEach(function(s){
    var card=el('div',{class:'money-card'});
    var head=el('div',{class:'money-row',style:'border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px'});
    var nameCol=el('div');
    nameCol.appendChild(el('span',{style:'font-family:\'Playfair Display\',serif;font-size:16px;display:block',text:s.player}));
    // Show how much this player is wagering in total
    var optedIn=activeGames.filter(function(k){return getGameParticipants(k).indexOf(s.player)>-1;});
    var playerWager=optedIn.reduce(function(sum,k){return sum+g[k].wager;},0);
    nameCol.appendChild(el('span',{style:'font-size:11px;color:var(--ink-soft)',text:'In for $'+playerWager+' across '+optedIn.length+' game'+(optedIn.length===1?'':'s')}));
    head.appendChild(nameCol);
    head.appendChild(el('span',{class:'money-amount '+(s.net>0?'positive':s.net<0?'negative':'neutral'),text:(s.net>=0?'+':'')+'$'+s.net.toFixed(0)}));
    card.appendChild(head);
    s.lines.forEach(function(l){
      var row=el('div',{class:'money-row',style:'font-size:13px'});
      row.appendChild(el('span',{style:'color:'+l.col,text:l.label}));
      row.appendChild(el('span',{style:'color:'+l.col+';font-weight:600',text:l.val}));
      card.appendChild(row);
    });
    app.appendChild(card);
  });
}

function fetchLiveScores(){
  fetch(ESPN_URL).then(function(r){return r.json();}).then(function(data){
    liveError=null;
    var scores={},names={},details={},athleteIds={};
    var ev=data.events&&data.events[0];
    if(ev){
      liveTournamentName=ev.name||'';
      liveEventId=ev.id||null;
      console.log('[ESPN] Event ID:',liveEventId,'Name:',liveTournamentName);
      var comp=ev.competitions&&ev.competitions[0];
      if(comp){
        liveStatus=(comp.status&&comp.status.type&&comp.status.type.description)||'';
        (comp.competitors||[]).forEach(function(c){
          var nm=c.athlete&&(c.athlete.displayName||c.athlete.fullName);
          if(!nm) return;
          var key=normName(nm);

          // Total score
          // Compute total score from linescore displayValues — more accurate than c.score which can lag
          var sc=c.score;
          var num=(sc==='E')?0:parseInt(sc,10);

          // After processing linescores below, we'll override with computed total if available
          var computedTotal=null;
          // Use computed total (from linescore displayValues) if available — it's always in sync
          // with the round data and avoids the lag on c.score
          if(computedTotal!==null) num=computedTotal;
          if(!isNaN(num)){scores[key]=num;names[key]=nm;}

          // ESPN structure: c.linescores = [{period:1, displayValue:"-4", linescores:[{hole data}]}, {period:2,...}]
          var ls=c.linescores||[];
          var todayRaw='';
          var statusDetail='';
          var currentRound=null;
          var currentRoundNum=null;
          var teeTime='';

          ls.forEach(function(round){
            var roundNum=round.period;
            var holes=round.linescores||[];

            // Sum round displayValues for an accurate total score
            if(round.displayValue){
              var rv=round.displayValue==='E'?0:parseInt(round.displayValue,10);
              if(!isNaN(rv)){
                computedTotal=(computedTotal===null?0:computedTotal)+rv;
              }
            }

            if(holes.length){
              currentRound=round;
              currentRoundNum=roundNum;
              if(roundNum){
                var strokes=holes.map(function(h){return typeof h.value==='number'?h.value:parseInt(h.value,10)||0;});
                var par=holes.map(function(h){
                  var st=(h.scoreType&&h.scoreType.displayValue)||'E';
                  var rel=st==='E'?0:(parseInt(st,10)||0);
                  var v=typeof h.value==='number'?h.value:parseInt(h.value,10)||4;
                  return v-rel;
                });
                var scoreTypes=holes.map(function(h){return (h.scoreType&&h.scoreType.displayValue)||'E';});
                if(!liveHoleScores[key]) liveHoleScores[key]={};
                liveHoleScores[key][roundNum]={strokes:strokes,par:par,scoreTypes:scoreTypes};
              }
            } else {
              // Round with no hole data — try to get tee time from its statistics
              var cats=round.statistics&&round.statistics.categories;
              if(cats) cats.forEach(function(cat){
                (cat.stats||[]).forEach(function(stat){
                  var dv=stat.displayValue||'';
                  // Tee time looks like "7:15 AM ET" or a datetime string containing a colon
                  if(!teeTime&&dv&&(dv.indexOf('AM')>-1||dv.indexOf('PM')>-1||dv.indexOf(':')>-1)){
                    // Try to parse and format
                    try{
                      var d=new Date(dv);
                      if(!isNaN(d.getTime())){
                        teeTime=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
                      }else{teeTime=dv;}
                    }catch(e){teeTime=dv;}
                  }
                });
              });
            }
          });

          // Derive round-labeled score and status detail
          if(currentRound){
            todayRaw=currentRound.displayValue||'';
            var holesPlayed=(currentRound.linescores||[]).length;
            var roundFinished=holesPlayed>=18;
            statusDetail=roundFinished?'F':('Thru '+holesPlayed);

            // If current round is finished, look for tee time in the NEXT round
            if(roundFinished){
              ls.forEach(function(round){
                if(round.period>currentRoundNum&&(!round.linescores||!round.linescores.length)){
                  // This is today's round — check for tee time in statistics
                  var cats=round.statistics&&round.statistics.categories;
                  if(cats) cats.forEach(function(cat){
                    (cat.stats||[]).forEach(function(stat){
                      var dv=stat.displayValue||'';
                      if(!teeTime&&dv&&(dv.indexOf('AM')>-1||dv.indexOf('PM')>-1||/\d+:\d+/.test(dv))){
                        try{
                          var d=new Date(dv);
                          teeTime=!isNaN(d.getTime())?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'}):dv;
                        }catch(e){teeTime=dv;}
                      }
                    });
                  });
                }
              });
              // Append tee time to status if we found one for the upcoming round
              if(teeTime) statusDetail='F \u00b7 Tee '+teeTime;
            }
          } else if(ls.length){
            statusDetail=teeTime?('Tee '+teeTime):'Not yet started';
          }

          var country=(c.athlete&&((c.athlete.flag&&c.athlete.flag.alt)||c.athlete.citizenship))||'';
          details[key]={statusDesc:'',statusDetail:statusDetail,todayRaw:todayRaw,roundNum:currentRoundNum,teeTime:teeTime,country:country};

          // Athlete ID (kept for potential fallback use)
          var aid=(c.athlete&&(c.athlete.id||c.athlete.uid||c.id))||c.id||null;
          if(aid) athleteIds[key]=String(aid);
        });
      }
    }
    console.log('[ESPN] Captured',Object.keys(athleteIds).length,'athlete IDs, eventId:',liveEventId);
    liveScores=scores;liveDisplayNames=names;liveDetails=details;liveAthleteIds=athleteIds;
    // Hole data is now parsed from nested linescores — save it immediately
    if(Object.keys(liveHoleScores).length>0) saveBBHistory();
    if(dashboardMode) render(); // refresh dashboard with latest scores
    else if(state&&localView==='leaderboard') render();
    if(state&&state.games&&state.games.bestBall&&state.games.bestBall.enabled){
      scheduleBestBallFetch();
      if(liveEventId&&Object.keys(liveHoleScores).length===0) fetchBestBallData();
    }
  }).catch(function(err){
    liveError=err;
    if(state&&localView==='leaderboard') render();
  });
}

function scheduleBestBallFetch(){
  if(bestBallFetchTimer) clearTimeout(bestBallFetchTimer);
  bestBallFetchTimer=setTimeout(fetchBestBallData,500);
}

function parseHoleData(rounds,key){
  rounds.forEach(function(round){
    var rn=round.id||round.number||round.roundId;
    if(!rn) return;
    var holes=round.linescores||[];
    if(!holes.length) return;
    var strokes=holes.map(function(h){var v=typeof h.value==='number'?h.value:parseInt(h.value,10);return isNaN(v)?null:v;});
    var par=holes.map(function(h){var p=typeof h.par==='number'?h.par:parseInt(h.par,10);return isNaN(p)?4:p;});
    var scoreTypes=holes.map(function(h){return(h.scoreType&&h.scoreType.name)||'';});
    if(strokes.filter(function(s){return s!==null;}).length>0){
      if(!liveHoleScores[key]) liveHoleScores[key]={};
      liveHoleScores[key][rn]={strokes:strokes,par:par,scoreTypes:scoreTypes};
    }
  });
}

function fetchBestBallData(){
  if(!liveEventId||!state) return;
  var drafted=draftedNames();
  if(!drafted.length) return;
  var draftedKeys=drafted.map(normName);
  var season=liveSeason;
  console.log('[BB] Starting fetch. eventId:',liveEventId,'athletes:',Object.keys(liveAthleteIds).length,'drafted:',drafted.length);

  // Strategy 1: sports.core.api.espn.com — most granular competitor data
  var coreUrl='https://sports.core.api.espn.com/v2/sports/golf/leagues/pga/events/'+liveEventId+'/competitions/'+liveEventId+'/competitors?limit=200&lang=en&region=us';
  fetch(coreUrl).then(function(r){return r.json();}).then(function(data){
    var items=data.items||data.competitors||[];
    console.log('[BB] Core API items:',items.length,'sample keys:',items[0]?Object.keys(items[0]):[]);
    var foundHoles=false;
    items.forEach(function(c){
      var nm=(c.athlete&&(c.athlete.displayName||c.athlete.fullName))||c.displayName;
      if(!nm) return;
      var key=normName(nm);
      if(draftedKeys.indexOf(key)===-1) return;
      var rounds=c.rounds||c.linescores||[];
      if(rounds.length){parseHoleData(rounds,key);foundHoles=true;}
    });
    if(foundHoles){saveBBHistory();if(state&&(localView==='leaderboard'||presenterMode)) render();}
    else{console.log('[BB] No hole data in core API, trying summary');tryBBSummary(draftedKeys,season);}
  }).catch(function(e){console.log('[BB] Core API error:',String(e));tryBBSummary(draftedKeys,season);});
}

function tryBBSummary(draftedKeys,season){
  var summaryUrl='https://site.api.espn.com/apis/site/v2/sports/golf/pga/summary?event='+liveEventId;
  fetch(summaryUrl).then(function(r){return r.json();}).then(function(data){
    console.log('[BB] Summary keys:',Object.keys(data));
    var comps=(data.leaderboard&&data.leaderboard.competitors)||data.competitors||
              (data.events&&data.events[0]&&data.events[0].competitions&&
               data.events[0].competitions[0]&&data.events[0].competitions[0].competitors)||[];
    console.log('[BB] Summary competitors:',comps.length,'sample:',comps[0]?Object.keys(comps[0]):[]);
    var foundHoles=false;
    comps.forEach(function(c){
      var nm=c.athlete&&(c.athlete.displayName||c.athlete.fullName);
      if(!nm) return;
      var key=normName(nm);
      if(draftedKeys.indexOf(key)===-1) return;
      var rounds=c.rounds||[];
      if(rounds.length){parseHoleData(rounds,key);foundHoles=true;}
    });
    if(foundHoles){saveBBHistory();if(state&&(localView==='leaderboard'||presenterMode)) render();}
    else{console.log('[BB] No hole data in summary, trying per-player');fetchBestBallPerPlayer(draftedKeys,season);}
  }).catch(function(e){console.log('[BB] Summary error:',String(e));fetchBestBallPerPlayer(draftedKeys,season);});
}

function fetchBestBallPerPlayer(draftedKeys,season){
  console.log('[BB] Per-player fetch for',draftedKeys.length,'golfers');
  var promises=draftedKeys.map(function(key){
    var athleteId=liveAthleteIds[key];
    if(!athleteId||!liveEventId) return Promise.resolve();
    var url='https://site.api.espn.com/apis/site/v2/sports/golf/pga/leaderboard/'+liveEventId+'/playersummary?season='+season+'&player='+athleteId;
    return fetch(url).then(function(r){return r.json();}).then(function(data){
      console.log('[BB] Per-player',key,'keys:',Object.keys(data),'rounds:',(data.rounds||[]).length);
      var rounds=data.rounds||(data.athlete&&data.athlete.rounds)||(data.competitor&&data.competitor.rounds)||[];
      if(rounds.length) parseHoleData(rounds,key);
    }).catch(function(e){console.log('[BB] Per-player fail',key,String(e));});
  });
  Promise.all(promises).then(function(){
    saveBBHistory();
    if(state&&(localView==='leaderboard'||presenterMode)) render();
  });
}

function computeBestBallRound(player,roundNum){
  var g=state.games&&state.games.bestBall;
  if(!g||!g.enabled) return null;
  // Use player's selected lineup for this round, or auto-select
  var eligible=getBBLineupForRound(player,roundNum);
  if(!eligible||!eligible.length) return null;
  // Find max holes using merged live+saved data
  var maxHoles=0;
  eligible.forEach(function(golfer){
    var roundData=getHoleDataForRound(normName(golfer),roundNum);
    var roundHoles=roundData&&roundData.strokes?roundData.strokes:null;
    if(roundHoles) maxHoles=Math.max(maxHoles,roundHoles.filter(function(h){return h!==null;}).length);
  });
  if(!maxHoles) return null;
  var teamRoundScore=0;
  for(var h=0;h<maxHoles;h++){
    var holeScores=eligible.map(function(golfer){
      var roundData=getHoleDataForRound(normName(golfer),roundNum);
      var roundHoles=roundData&&roundData.strokes?roundData.strokes:null;
      return roundHoles&&roundHoles[h]!==undefined&&roundHoles[h]!==null?roundHoles[h]:null;
    }).filter(function(s){return s!==null;});
    if(holeScores.length) teamRoundScore+=Math.min.apply(null,holeScores);
  }
  return{score:teamRoundScore,holesComplete:maxHoles,eligible:eligible};
}

function computeBestBallTotal(player){
  var g=state.games&&state.games.bestBall;
  if(!g||!g.enabled) return null;
  // Collect rounds with data from BOTH live and saved history
  var roundSet={};
  var picks=state.picks.filter(function(pk){return pk.player===player;}).map(function(pk){return pk.golfer;});
  picks.forEach(function(golfer){
    var key=normName(golfer);
    var live=liveHoleScores[key]||{};
    var saved=savedBBHistory[key]||{};
    Object.keys(live).forEach(function(r){roundSet[r]=true;});
    Object.keys(saved).forEach(function(r){roundSet[r]=true;});
  });
  if(!Object.keys(roundSet).length) return null;
  var total=0;var roundsFound=0;
  Object.keys(roundSet).forEach(function(r){
    var res=computeBestBallRound(player,parseInt(r,10));
    if(res&&res.holesComplete>0){total+=res.score;roundsFound++;}
  });
  return roundsFound?{total:total,rounds:roundsFound}:null;
}

function computePointsScore(player){
  var g=state.games&&state.games.points;
  if(!g||!g.enabled) return null;
  var table=g.table||DEFAULT_POINTS_TABLE;
  var numG=g.numGolfers||state.rosterSize;
  // Build position map with tie handling
  var sorted=Object.keys(liveScores).sort(function(a,b){return liveScores[a]-liveScores[b];});
  var posMap={};
  sorted.forEach(function(k,i){
    posMap[k]=(i>0&&liveScores[k]===liveScores[sorted[i-1]])?posMap[sorted[i-1]]:i+1;
  });
  var picks=state.picks.filter(function(pk){return pk.player===player&&!isCut(pk.golfer);}).map(function(pk){return pk.golfer;});
  var total=0;var counted=0;
  picks.forEach(function(golfer){
    if(counted>=numG) return;
    var pos=posMap[normName(golfer)];
    if(pos&&pos<=table.length){total+=table[pos-1]||0;}
    counted++;
  });
  return total;
}

loadState();
initFirebase();
render();
fetchLiveScores();
setInterval(fetchLiveScores,REFRESH_MS);

function loadState(){
  // handled per-pool in enterPool; this is a no-op at top level now
  // but we keep the function signature for safety
}
})();
</script>
