function isCut(g){return!!(state.cuts&&state.cuts[normName(g)]);}
function toggleCut(g){
  if(!isCommissioner) return;
  var key=normName(g);
  if(!state.cuts) state.cuts={};
  if(state.cuts[key]) delete state.cuts[key];else state.cuts[key]=true;
  saveState();render();
}
function ownerOf(g){
  var pk=state.picks.find(function(pk){return pk.golfer===g;});
  return pk?pk.player:'';
}
function scoreFor(g){
  if(isCut(g)) return undefined;
  var key=normName(g);
  if(liveScores.hasOwnProperty(key)) return liveScores[key];
  return undefined;
}

function teamResults(){
  return state.players.map(function(p){
    var picksForP=state.picks.filter(function(pk){return pk.player===p;}).map(function(pk){return pk.golfer;});
    var withdrawnGolfer=null,altInUse=null;
    if(state.altActive[p]&&state.altReplacing[p]&&state.alts[p]){
      withdrawnGolfer=state.altReplacing[p];altInUse=state.alts[p];
      picksForP=picksForP.filter(function(g){return g!==withdrawnGolfer;});
      picksForP.push(altInUse);
    }
    var active=picksForP.filter(function(g){return!isCut(g);});
    var cut=picksForP.filter(function(g){return isCut(g);});
    var scoredActive=active.map(function(g){return{golfer:g,score:scoreFor(g),cut:false,alt:g===altInUse};}).filter(function(x){return x.score!==undefined;}).sort(function(a,b){return a.score-b.score;});
    var unscoredActive=active.filter(function(g){return scoreFor(g)===undefined;}).map(function(g){return{golfer:g,score:undefined,cut:false,alt:g===altInUse};});
    var cutList=cut.map(function(g){return{golfer:g,score:undefined,cut:true,alt:false};});
    var wdList=withdrawnGolfer?[{golfer:withdrawnGolfer,score:undefined,cut:false,wd:true}]:[];
    var topN=scoredActive.slice(0,state.topScores);
    var rest=scoredActive.slice(state.topScores).concat(unscoredActive).concat(cutList).concat(wdList);
    var hasEnough=active.length>=state.topScores;
    var total=hasEnough?topN.reduce(function(s,x){return s+x.score;},0):null;
    return{player:p,top5:topN,rest:rest,total:total,hasEnough:hasEnough,scoredCount:scoredActive.length,activeCount:active.length};
  });
}

function renderPresenter(app){
  var mainOrder=state.draftStarted?snakeOrder(state.numPlayers,state.rosterSize):[];

  var wrap=el('div',{class:'presenter-wrap'});

  // Header
  wrap.appendChild(el('p',{class:'p-eyebrow',text:'A tradition unlike any other'}));
  var poolName=(currentPoolId&&poolsMeta[currentPoolId]&&poolsMeta[currentPoolId].name)||'The Pool';
  wrap.appendChild(el('p',{class:'p-pool-name',text:poolName}));

  if(!state.draftStarted){
    wrap.appendChild(el('p',{class:'p-on-clock',style:'font-size:clamp(24px,5vw,60px)',text:'Draft starting soon\u2026'}));
    if(state.draftScheduled) wrap.appendChild(el('p',{class:'p-round-label',text:formatDraftSchedule(state.draftScheduled)}));
  }else if(mainDone){

    var onClockPlayer=state.players[mainOrder[idx]];
    var hasAutodraft=state.autodraftPlayers&&state.autodraftPlayers[onClockPlayer];
    wrap.appendChild(el('p',{class:'p-on-clock',text:onClockPlayer}));
    wrap.appendChild(el('p',{class:'p-sub-label',text:hasAutodraft?'is autodrafting\u2026':'is on the clock'}));

    // Clock
    if(state.clockEnabled&&state.clockStartedAt&&!state.clockPaused){
      var elp=(Date.now()-state.clockStartedAt)/1000;
      var rem=Math.max(0,state.pickClockSeconds-elp);
      var sec=Math.ceil(rem);
      var col=sec<=10?'#e53935':sec<=30?'#c9a227':'#66bb6a';
      wrap.appendChild(el('p',{id:'presenter-clock-num',class:'p-clock-num',style:'color:'+col,text:sec+'s'}));
      var bw=el('div',{class:'p-clock-bar-wrap'});
      bw.appendChild(el('div',{id:'presenter-clock-bar',class:'p-clock-bar',style:'width:'+((rem/state.pickClockSeconds)*100)+'%;background:'+col}));
      wrap.appendChild(bw);
    }else if(state.clockPaused){
      wrap.appendChild(el('p',{class:'p-clock-num',style:'color:#c9a227;font-size:clamp(22px,4vw,48px)',text:'\u23f8 Paused'}));
    }else if(!state.clockEnabled){
      wrap.appendChild(el('p',{style:'text-align:center;font-size:clamp(12px,1.6vw,18px);color:rgba(255,255,255,0.35);margin:4px 0 12px',text:'No pick clock'}));
    }

    // Last pick
    if(state.picks.length>0){
      var lp=state.picks[state.picks.length-1];
      var lpNum=state.picks.length;
      var lpRound=Math.floor((lpNum-1)/state.numPlayers)+1;
      var lpCard=el('div',{class:'p-last-pick'});
      lpCard.appendChild(el('p',{class:'pick-label',text:'\u2714 Round '+lpRound+' \u00b7 Pick '+lpNum+(lp.autodrafted?' (auto)':lp.manual?' (manual)':'')}));
      lpCard.appendChild(el('p',{class:'pick-text',text:lp.golfer+' \u2192 '+lp.player}));
      wrap.appendChild(lpCard);
    }
  }

  // Team rosters
  var rosters=el('div',{class:'p-rosters'});
  var curPlayer=!mainDone&&state.draftStarted?state.players[mainOrder[idx]]:null;
  state.players.forEach(function(p){
    var picks=state.picks.filter(function(pk){return pk.player===p;});
    var rc=el('div',{class:'p-roster-card'+(p===curPlayer?' on-clock':'')});
    rc.appendChild(el('p',{class:'p-roster-name',text:p+' ('+picks.length+'/'+state.rosterSize+')'}));
    picks.forEach(function(pk,i){
      var fresh=i===picks.length-1&&state.picks.indexOf(pk)===state.picks.length-1;
      rc.appendChild(el('p',{class:'p-pick-item'+(fresh?' fresh':''),text:(i+1)+'. '+pk.golfer}));
    });
    rosters.appendChild(rc);
  });
  wrap.appendChild(rosters);

  // Exit button
  var exitBtn=el('button',{type:'button',class:'p-exit-btn',text:'\u2715 Exit TV Mode'});
  exitBtn.addEventListener('click',function(){presenterMode=false;render();});
  wrap.appendChild(exitBtn);
  app.appendChild(wrap);
}

function holeStyle(strokes,par){
  if(strokes===null||strokes===undefined||par===null) return '';
  var d=strokes-par;
  if(d<=-2) return 'sc-eagle';
  if(d===-1) return 'sc-birdie';
  if(d===0) return 'sc-par';
  if(d===1) return 'sc-bogey';
  return 'sc-double';
}

function renderBestBallScorecard(app,playerName){
  var g=state.games&&state.games.bestBall;
  if(!g||!g.enabled) return;
  var picks=state.picks.filter(function(pk){return pk.player===playerName&&!isCut(pk.golfer);}).map(function(pk){return pk.golfer;});
  var numG=g.numGolfers||picks.length;
  var ranked=picks.slice().sort(function(a,b){
    var sa=liveScores[normName(a)],sb=liveScores[normName(b)];
    if(sa===undefined&&sb===undefined) return 0;
    if(sa===undefined) return 1;if(sb===undefined) return -1;
    return sa-sb;
  });
  var eligible=ranked.slice(0,numG);

  // Collect rounds that have data
  var roundSet={};
  eligible.forEach(function(golfer){
    var hd=liveHoleScores[normName(golfer)]||{};
    Object.keys(hd).forEach(function(r){roundSet[r]=true;});
  });
  var roundNums=Object.keys(roundSet).map(Number).sort(function(a,b){return a-b;});
  if(!roundNums.length){
    var waiting=el('p',{class:'small-muted',style:'margin:4px 0',text:'Hole-by-hole data loading once the tournament is underway\u2026'});
    app.appendChild(waiting);return;
  }

  roundNums.forEach(function(rn){
    var card=el('div',{class:'card',style:'padding:0.75rem 0.6rem'});
    card.appendChild(el('label',{class:'field-label',text:'Round '+rn+' \u2014 '+playerName+' (Best Ball)'}));

    // Gather golfer data for this round
    var golferRows=eligible.map(function(golfer){
      var key=normName(golfer);
      var hd=liveHoleScores[key]&&liveHoleScores[key][rn];
      return{name:golfer,strokes:hd?hd.strokes:[],par:hd?hd.par:[]};
    });
    // Get par from first available golfer
    var parRow=[];
    for(var gi=0;gi<golferRows.length;gi++){if(golferRows[gi].par.length){parRow=golferRows[gi].par;break;}}
    if(!parRow.length) parRow=Array(18).fill(4);

    // Compute best ball per hole
    var maxHoles=Math.max.apply(null,golferRows.map(function(r){return r.strokes.length;})||[0]);
    var bbHoles=[];
    for(var h=0;h<maxHoles;h++){
      var hs=golferRows.map(function(r){return r.strokes[h];}).filter(function(s){return s!==null&&s!==undefined&&!isNaN(s);});
      bbHoles.push(hs.length?Math.min.apply(null,hs):null);
    }

    // Build front 9 then back 9
    [{label:'Front 9',start:0,end:Math.min(9,maxHoles)},{label:'Back 9',start:9,end:maxHoles}].forEach(function(half){
      if(half.start>=maxHoles) return;
      var wrap=el('div',{class:'sc-wrap'});
      var t=el('table',{class:'sc-table'});
      var thead=el('thead');
      // Hole number header row
      var hdr=el('tr');
      hdr.appendChild(el('th',{class:'sc-label sc-hole-head',text:half.label}));
      for(var h2=half.start;h2<half.end;h2++) hdr.appendChild(el('th',{class:'sc-hole-head',text:(h2+1)+''}));
      hdr.appendChild(el('th',{class:'sc-hole-head sc-out-in',text:half.end<=9?'OUT':'IN'}));
      if(half.end>9) hdr.appendChild(el('th',{class:'sc-hole-head',text:'TOT'}));
      thead.appendChild(hdr);t.appendChild(thead);
      var tbody=el('tbody');

      // Par row
      var pr=el('tr',{class:'sc-par-row'});
      pr.appendChild(el('td',{class:'sc-label',text:'Par'}));
      var halfPar=0;
      for(var h3=half.start;h3<half.end;h3++){var p=parRow[h3]||4;halfPar+=p;pr.appendChild(el('td',{text:p+''}));}
      pr.appendChild(el('td',{class:'sc-out-in',text:halfPar+''}));
      if(half.end>9){var totPar=parRow.slice(0,18).reduce(function(s,v){return s+(v||4);},0);pr.appendChild(el('td',{text:totPar+''}));}
      tbody.appendChild(pr);

      // Golfer rows
      golferRows.forEach(function(gr){
        var row=el('tr');
        var lastName=gr.name.split(' ').pop();
        row.appendChild(el('td',{class:'sc-label',text:lastName}));
        var halfTotal=0;
        for(var h4=half.start;h4<half.end;h4++){
          var s=gr.strokes[h4];var p2=parRow[h4]||4;
          if(s!==null&&s!==undefined) halfTotal+=s;
          var cls=s!==null&&s!==undefined?holeStyle(s,p2):'';
          var td=el('td');
          if(s!==null&&s!==undefined){
            var ball=el('span',{class:'sc-ball '+(cls||''),text:s+''});
            td.appendChild(ball);
          }else{td.textContent='\u2014';}
          row.appendChild(td);
        }
        row.appendChild(el('td',{class:'sc-out-in',text:halfTotal?halfTotal+'':'\u2014'}));
        if(half.end>9){
          var frontTotal=gr.strokes.slice(0,9).reduce(function(s,v){return s+(v||0);},0);
          row.appendChild(el('td',{text:(frontTotal&&halfTotal)?(frontTotal+halfTotal)+'':'\u2014'}));
        }
        tbody.appendChild(row);
      });

      // Team best ball row
      var bbr=el('tr',{class:'sc-bb-row'});
      bbr.appendChild(el('td',{class:'sc-label',text:'BEST BALL'}));
      var bbHalfTotal=0;
      for(var h5=half.start;h5<half.end;h5++){
        var bbs=bbHoles[h5];var p3=parRow[h5]||4;
        if(bbs!==null) bbHalfTotal+=bbs;
        var cls2=bbs!==null?holeStyle(bbs,p3):'';
        var td2=el('td');
        if(bbs!==null){var ball2=el('span',{class:'sc-ball '+(cls2||''),text:bbs+''});td2.appendChild(ball2);}
        else{td2.textContent='\u2014';}
        bbr.appendChild(td2);
      }
      bbr.appendChild(el('td',{class:'sc-out-in',text:bbHalfTotal?bbHalfTotal+'':'\u2014'}));
      if(half.end>9){
        var bbFront=bbHoles.slice(0,9).reduce(function(s,v){return s+(v||0);},0);
        bbr.appendChild(el('td',{text:(bbFront&&bbHalfTotal)?(bbFront+bbHalfTotal)+'':'\u2014'}));
      }
      tbody.appendChild(bbr);
      t.appendChild(tbody);
      wrap.appendChild(t);
      card.appendChild(wrap);
    });
    app.appendChild(card);
  });
}

function renderLeaderboard(app){

  if(!drafted.length){app.appendChild(el('p',{class:'small-muted',text:'Draft golfers first.'}));return;}

  var liveBar=el('div',{class:'row-flex',style:'margin-bottom:10px;justify-content:space-between'});

  ltag.appendChild(el('span',{class:'live-dot'}));
  var statusText=liveError?'Live scores unavailable':(liveTournamentName?(liveTournamentName+(liveStatus?' \u00b7 '+liveStatus:'')):'Loading live scores\u2026');
  ltag.appendChild(document.createTextNode(' '+statusText));
  liveBar.appendChild(ltag);
  var refreshBtn=btn('Refresh',function(){fetchLiveScores(true);},'');
  refreshBtn.style.cssText='font-size:12px;padding:5px 10px;';
  liveBar.appendChild(refreshBtn);
  app.appendChild(liveBar);

  var draftedOwnerMap={};
  drafted.forEach(function(g){draftedOwnerMap[normName(g)]=ownerOf(g);});
  var allScored=Object.keys(liveScores).map(function(k){return{key:k,score:liveScores[k]};}).sort(function(a,b){return a.score-b.score;});

  // Leader banner
  var lowest=allScored[0]||null;
  if(lowest){

  // Pool standings

  // All drafted golfers by score

}

function parseTodayScore(normKey){
  var d=liveDetails[normKey]||{};
  var raw=(d.todayRaw||'').trim();
  if(raw===''||raw==='-') return null;
  if(raw==='E') return 0;
  var n=parseInt(raw,10);
  return isNaN(n)?null:n;
}

function getBetScores(ch){
  var fk=normName(ch.fromGolfer),tk=normName(ch.toGolfer);
  var fs,ts;
  if(ch.type==='round'){
    fs=parseTodayScore(fk); ts=parseTodayScore(tk);
  }else if(ch.type==='remaining'){
    // Delta from score at acceptance — whoever improves more wins
    if(ch.fromStartScore===undefined||ch.fromStartScore===null||ch.toStartScore===undefined||ch.toStartScore===null){return{fs:null,ts:null};}
    var fCur=liveScores.hasOwnProperty(fk)?liveScores[fk]:null;
    var tCur=liveScores.hasOwnProperty(tk)?liveScores[tk]:null;
    if(fCur===null||tCur===null) return{fs:null,ts:null};
    fs=fCur-ch.fromStartScore; ts=tCur-ch.toStartScore;
  }else{
    // 'tournament' (legacy) — full tournament total
    fs=liveScores.hasOwnProperty(fk)?liveScores[fk]:null;
    ts=liveScores.hasOwnProperty(tk)?liveScores[tk]:null;
  }
  return{fs:fs,ts:ts};
}

function getBetLeader(ch){
  if(ch.winner) return ch.winner; // permanently settled — ignore live scores
  var s=getBetScores(ch);
  if(s.fs===null||s.ts===null) return null;
  if(s.fs<s.ts) return 'from';
  if(s.ts<s.fs) return 'to';
  return 'push';
}

function renderBets(app){

      var leader=getBetLeader(ch);

      else if(leader==='to'){netMap[ch.to]=(netMap[ch.to]||0)+ch.amount;netMap[ch.from]=(netMap[ch.from]||0)-ch.amount;}
    });

      var tags=el('div',{style:'display:flex;gap:4px'});

      card.appendChild(head);
      var vs=el('div',{class:'bet-vs'});
      var fg=el('div',{class:'bet-golfer'});fg.appendChild(el('div',{class:'bowner',text:ch.from}));fg.appendChild(el('div',{text:ch.fromGolfer}));
      vs.appendChild(fg);
      vs.appendChild(el('div',{class:'bet-mid',text:'vs'}));
      var tg=el('div',{class:'bet-golfer',style:'text-align:right'});tg.appendChild(el('div',{class:'bowner',text:ch.to}));tg.appendChild(el('div',{text:ch.toGolfer}));
      vs.appendChild(tg);
      card.appendChild(vs);
      card.appendChild(el('div',{class:'bet-meta',html:'<strong>$'+ch.amount+' bet</strong>'}));
      // Accept / Decline buttons — anyone can tap (relies on honesty like the rest of the app)
      var btnRow=el('div',{class:'row-flex',style:'margin-top:10px'});
      btnRow.appendChild(el('p',{class:'small-muted',style:'flex:1;margin:0',text:'Challenge for '+ch.to+':'}));
      var accBtn=btn('Accept',function(){
        var idx=state.challenges.findIndex(function(c){return c.id===ch.id;});
        if(idx>-1){
          state.challenges[idx].status='active';
          if(ch.type==='remaining'){
            var fk2=normName(ch.fromGolfer),tk2=normName(ch.toGolfer);
            state.challenges[idx].fromStartScore=liveScores.hasOwnProperty(fk2)?liveScores[fk2]:null;
            state.challenges[idx].toStartScore=liveScores.hasOwnProperty(tk2)?liveScores[tk2]:null;
          }

        var idx=state.challenges.findIndex(function(c){return c.id===ch.id;});

      },'danger');

  // ── Active bets ──

      tags.appendChild(el('span',{style:'font-size:13px;font-family:\'Playfair Display\',serif;font-weight:600',text:'$'+ch.amount}));
      head.appendChild(tags);
      card.appendChild(head);
      var vs=el('div',{class:'bet-vs'});
      var fg=el('div',{class:'bet-golfer'+(fWin?' winning':tWin?' losing':'')});
      fg.appendChild(el('div',{class:'bowner',text:ch.from}));
      fg.appendChild(el('div',{text:ch.fromGolfer}));
      var fsDisp=scores.fs===null?'\u2014':formatScore(scores.fs);
      fg.appendChild(el('div',{class:'bscore',text:fsDisp}));
      vs.appendChild(fg);
      vs.appendChild(el('div',{class:'bet-mid',text:'vs'}));
      var tg=el('div',{class:'bet-golfer'+(tWin?' winning':fWin?' losing':''),style:'text-align:right'});

    var amtInp=el('input',{type:'number',min:'1',step:'1',style:'width:100%'});amtInp.value=fState.amount;
    amtInp.addEventListener('change',function(){fState.amount=Math.max(1,parseInt(this.value,10)||1);});
    r5.appendChild(amtInp);formContainer.appendChild(r5);

    // Type toggle
    var r6=el('div',{class:'form-row'});
    r6.appendChild(el('label',{text:'Bet covers'}));
    var tog=el('div',{class:'toggle-row'});
    ['round','remaining'].forEach(function(t){
      var to=el('button',{type:'button',class:'toggle-opt'+(fState.type===t?' selected':''),text:t==='round'?'This round only':'All remaining rounds'});
      to.addEventListener('click',function(){fState.type=t;rebuildForm();});
      tog.appendChild(to);
    });
    r6.appendChild(tog);formContainer.appendChild(r6);

    // Submit
    var ready=fState.from&&fState.fromGolfer&&fState.to&&fState.toGolfer&&fState.amount>0;
    var subBtn=btn('Send challenge \u2192',function(){
      if(!ready) return;
      if(!Array.isArray(state.challenges)) state.challenges=[];
      state.challenges.push({id:'ch_'+Date.now(),from:fState.from,fromGolfer:fState.fromGolfer,to:fState.to,toGolfer:fState.toGolfer,amount:fState.amount,type:fState.type,status:'pending',createdAt:Date.now()});
      saveState();render();
    },ready?'primary full':'full');
    subBtn.disabled=!ready;
    formContainer.appendChild(subBtn);
  }
  rebuildForm();
  app.appendChild(form);
}

function renderMoney(app){
  var g=state.games;
  var activeGames=Object.keys(g).filter(function(k){return g[k].enabled;});
  if(!activeGames.length){
    app.appendChild(el('p',{class:'small-muted',text:'No games are currently active. Enable games in Setup to see money positions.'}));
    return;
  }

  // ── Compute game winners ──
  // Low score
  var lsResults=g.lowScore&&g.lowScore.enabled?teamResults().filter(function(r){return r.total!==null;}):[];
  lsResults.sort(function(a,b){return a.total-b.total;});
  var lsWinners=lsResults.length?lsResults.filter(function(r){return r.total===lsResults[0].total;}).map(function(r){return r.player;}):[]; 

  // Leader
  var allScored=Object.keys(liveScores).map(function(k){return{key:k,score:liveScores[k]};}).sort(function(a,b){return a.score-b.score;});
  var tlKey=allScored.length?allScored[0].key:null;
  var leaderWinners=g.leader&&g.leader.enabled&&tlKey?state.players.filter(function(p){return state.picks.some(function(pk){return pk.player===p&&normName(pk.golfer)===tlKey&&!isCut(pk.golfer);});}):[];

  // Best ball
  var bbResults=[];
  if(g.bestBall&&g.bestBall.enabled){
    bbResults=state.players.map(function(p){var r=computeBestBallTotal(p);return{player:p,result:r,total:r?r.total:null};}).filter(function(x){return x.total!==null;});
    bbResults.sort(function(a,b){return a.total-b.total;});
  }
  var bbWinners=bbResults.length?bbResults.filter(function(r){return r.total===bbResults[0].total;}).map(function(r){return r.player;}):[]; 

  // Points
  var ptResults=[];
  if(g.points&&g.points.enabled){
    ptResults=state.players.map(function(p){return{player:p,total:computePointsScore(p)||0};});
    ptResults.sort(function(a,b){return b.total-a.total;}); // higher points = better
  }
  var ptWinners=ptResults.length?ptResults.filter(function(r){return r.total===ptResults[0].total&&r.total>0;}).map(function(r){return r.player;}):[]; 

  // ── Games summary card ──
  var hcard=el('div',{class:'money-card'});
  hcard.appendChild(el('label',{class:'money-pot-label',text:'Active games'}));
  var gameDefs=[
    {key:'lowScore',label:'Low Team Score',winners:lsWinners},
    {key:'leader',label:'Tournament Leader',winners:leaderWinners},
    {key:'bestBall',label:'Best Ball',winners:bbWinners},
    {key:'points',label:'Points Leaderboard',winners:ptWinners}
  ];
  // "Total per player" varies per person depending on opt-ins — show the pool totals instead
  var totalPool=0;
  gameDefs.forEach(function(d){
    if(!g[d.key]||!g[d.key].enabled) return;
    var parts=getGameParticipants(d.key);
    var pot=g[d.key].wager*parts.length;
    totalPool+=pot;
    var row=el('div',{class:'money-row'});
    var left=el('div');
    left.appendChild(el('div',{text:d.label,style:'font-size:14.5px'}));
    var subParts=parts.length<state.numPlayers?
      parts.length+' of '+state.numPlayers+' players \u00b7 ':
      '';
    left.appendChild(el('div',{class:'small-muted',style:'font-size:12px',
      text:subParts+(d.winners.length?'Leading: '+d.winners.join(' & '):'No leader yet')}));
    row.appendChild(left);
    row.appendChild(el('span',{class:'money-amount neutral',text:'$'+pot}));
    hcard.appendChild(row);
  });
  var totRow=el('div',{class:'money-row',style:'border-top:2px solid var(--line);margin-top:4px;padding-top:10px'});
  totRow.appendChild(el('span',{style:'font-weight:600',text:'Total pool'}));
  totRow.appendChild(el('span',{class:'money-amount neutral',style:'font-weight:600',text:'$'+totalPool}));
  hcard.appendChild(totRow);
  hcard.appendChild(el('p',{class:'money-split-note',text:'Pot sizes reflect only opted-in players. Check the Queue tab to update your opt-ins before the draft starts.'}));
  app.appendChild(hcard);

  // ── Per player breakdown ──
  // Build net per player across all games
  var summary=state.players.map(function(p){
    var paid=activeGames.reduce(function(s,k){
      var parts=getGameParticipants(k);
      return s+(parts.indexOf(p)>-1?g[k].wager:0);
    },0);
    var lines=[];
    var net=-paid;
    lines.push({label:'Total wagered',val:'-$'+paid,col:'var(--ink-soft)'});

    function addGame(winners,gameKey,label){
      if(!g[gameKey]||!g[gameKey].enabled) return;
      var parts=getGameParticipants(gameKey);
      if(parts.indexOf(p)===-1){
        lines.push({label:label+' (not opted in)',val:'\u2014',col:'var(--ink-soft)'});
        return;
      }
      var pot=g[gameKey].wager*parts.length;
      if(!winners.length){
        lines.push({label:label+' (no winner yet)',val:'\u2014',col:'var(--ink-soft)'});
      }else if(winners.indexOf(p)>-1){
        var eligible=winners.filter(function(w){return parts.indexOf(w)>-1;});
        var share=eligible.length?pot/eligible.length:0;
        net+=share;
        lines.push({label:label+(eligible.length>1?' (split)':''),val:'+$'+share.toFixed(0),col:'#1a5c2e'});
      }else{
        lines.push({label:label,val:'-$'+g[gameKey].wager,col:'#b0413e'});
      }
    }
    addGame(lsWinners,'lowScore','Low Team Score');
    addGame(leaderWinners,'leader','Tournament Leader');
    if(g.bestBall&&g.bestBall.enabled){
      var myBB=bbResults.find(function(r){return r.player===p;});
      var bbDisp=myBB&&myBB.total!==null?'('+myBB.total+' strokes)':'(no data yet)';
      addGame(bbWinners,'bestBall','Best Ball '+bbDisp);
    }
    if(g.points&&g.points.enabled){
      var myPts=ptResults.find(function(r){return r.player===p;});
      var ptDisp=myPts?'('+myPts.total+' pts)':'(0 pts)';
      addGame(ptWinners,'points','Points '+ptDisp);
    }
    // Side bets
    var activeChallenges=(state.challenges||[]).filter(function(c){return c.status==='active';});
    var sideNet=0;
    activeChallenges.forEach(function(ch){
      var leader=getBetLeader(ch);
      if(leader==='from'&&ch.from===p) sideNet+=ch.amount;
      else if(leader==='to'&&ch.to===p) sideNet+=ch.amount;
      else if(leader==='from'&&ch.to===p) sideNet-=ch.amount;
      else if(leader==='to'&&ch.from===p) sideNet-=ch.amount;
    });
    if(activeChallenges.length){
      var myBets=activeChallenges.filter(function(c){return c.from===p||c.to===p;});
      if(myBets.length) lines.push({label:'Side bets ('+myBets.length+')',val:(sideNet>=0?'+':'')+'\$'+sideNet,col:sideNet>0?'#1a5c2e':sideNet<0?'#b0413e':'var(--ink-soft)'});
      net+=sideNet;
    }
    return{player:p,net:net,lines:lines};
  });

  app.appendChild(el('label',{class:'field-label',text:'Current money position',style:'display:block;margin:14px 2px 8px'}));
  summary.sort(function(a,b){return b.net-a.net;});
  summary.forEach(function(s){
    var card=el('div',{class:'money-card'});
    var head=el('div',{class:'money-row',style:'border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px'});
    var nameCol=el('div');
    nameCol.appendChild(el('span',{style:'font-family:\'Playfair Display\',serif;font-size:16px;display:block',text:s.player}));
    // Show how much this player is wagering in total
    var optedIn=activeGames.filter(function(k){return getGameParticipants(k).indexOf(s.player)>-1;});
    var playerWager=optedIn.reduce(function(sum,k){return sum+g[k].wager;},0);
    nameCol.appendChild(el('span',{style:'font-size:11px;color:var(--ink-soft)',text:'In for $'+playerWager+' across '+optedIn.length+' game'+(optedIn.length===1?'':'s')}));
    head.appendChild(nameCol);
    head.appendChild(el('span',{class:'money-amount '+(s.net>0?'positive':s.net<0?'negative':'neutral'),text:(s.net>=0?'+':'')+'$'+s.net.toFixed(0)}));
    card.appendChild(head);
    s.lines.forEach(function(l){
      var row=el('div',{class:'money-row',style:'font-size:13px'});
      row.appendChild(el('span',{style:'color:'+l.col,text:l.label}));
      row.appendChild(el('span',{style:'color:'+l.col+';font-weight:600',text:l.val}));
      card.appendChild(row);
    });
    app.appendChild(card);
  });
}

function fetchLiveScores(){
  fetch(ESPN_URL).then(function(r){return r.json();}).then(function(data){
    liveError=null;
    var scores={},names={},details={},athleteIds={};
    var ev=data.events&&data.events[0];
    if(ev){
      liveTournamentName=ev.name||'';
      liveEventId=ev.id||null;
      var comp=ev.competitions&&ev.competitions[0];
      if(comp){
        liveStatus=(comp.status&&comp.status.type&&comp.status.type.description)||'';
        (comp.competitors||[]).forEach(function(c){
          var nm=c.athlete&&(c.athlete.displayName||c.athlete.fullName);
          if(!nm) return;
          var key=normName(nm);
          var sc=c.score;
          var num=(sc==='E')?0:parseInt(sc,10);
          if(!isNaN(num)){scores[key]=num;names[key]=nm;}
          var sType=(c.status&&c.status.type)||{};
          var statusDesc=sType.description||'';
          var statusDetail=sType.detail||'';
          var ls=c.linescores||[];
          var todayRaw=ls.length?(ls[ls.length-1].displayValue||''):'';
          var country=(c.athlete&&((c.athlete.flag&&c.athlete.flag.alt)||c.athlete.citizenship))||'';
          details[key]={statusDesc:statusDesc,statusDetail:statusDetail,todayRaw:todayRaw,country:country};
          // Capture athlete ID for best ball hole-by-hole fetches
          if(c.athlete&&c.athlete.id) athleteIds[key]=c.athlete.id;
        });
      }
    }
    liveScores=scores;liveDisplayNames=names;liveDetails=details;liveAthleteIds=athleteIds;
    if(state&&localView==='leaderboard') render();
    // Trigger best ball data fetch if that game is enabled
    if(state&&state.games&&state.games.bestBall&&state.games.bestBall.enabled){
      scheduleBestBallFetch();
    }
  }).catch(function(err){
    liveError=err;
    if(state&&localView==='leaderboard') render();
  });
}

function scheduleBestBallFetch(){
  if(bestBallFetchTimer) clearTimeout(bestBallFetchTimer);
  bestBallFetchTimer=setTimeout(fetchBestBallData,500);
}

function fetchBestBallData(){
  if(!liveEventId||!state) return;
  // Get all drafted golfers that have an athlete ID
  var drafted=draftedNames();
  if(!drafted.length) return;
  var season=liveSeason;
  var promises=drafted.map(function(golfer){
    var key=normName(golfer);
    var athleteId=liveAthleteIds[key];
    if(!athleteId) return Promise.resolve();
    var url='https://site.web.api.espn.com/apis/site/v2/sports/golf/pga/leaderboard/'+liveEventId+'/playersummary?season='+season+'&player='+athleteId;
    return fetch(url).then(function(r){return r.json();}).then(function(data){
      // Parse rounds[].linescores[] - each linescore is one hole
      var rounds=data.rounds||[];
      if(!rounds.length&&data.athlete) rounds=data.athlete.rounds||[];
      liveHoleScores[key]={};
      rounds.forEach(function(round){
        var roundNum=round.id||round.number||round.roundId;
        if(!roundNum) return;
        var strokes=[],par=[],scoreTypes=[];
        (round.linescores||[]).forEach(function(ls){
          var v=typeof ls.value==='number'?ls.value:parseInt(ls.value,10);
          var p=typeof ls.par==='number'?ls.par:parseInt(ls.par,10);
          var st=(ls.scoreType&&ls.scoreType.name)||'';
          strokes.push(isNaN(v)?null:v);
          par.push(isNaN(p)?4:p);
          scoreTypes.push(st);
        });
        if(strokes.length) liveHoleScores[key][roundNum]={strokes:strokes,par:par,scoreTypes:scoreTypes};
      });
    }).catch(function(){});
  });
  Promise.all(promises).then(function(){
    if(state&&(localView==='leaderboard'||localView==='money')) render();
  });
}

function computeBestBallRound(player,roundNum){
  var g=state.games&&state.games.bestBall;
  if(!g||!g.enabled) return null;
  var picks=state.picks.filter(function(pk){return pk.player===player&&!isCut(pk.golfer);}).map(function(pk){return pk.golfer;});
  if(!picks.length) return null;
  // Select top numGolfers by current tournament score
  var numG=g.numGolfers||picks.length;
  var ranked=picks.slice().sort(function(a,b){
    var sa=liveScores[normName(a)];var sb=liveScores[normName(b)];
    if(sa===undefined&&sb===undefined) return 0;
    if(sa===undefined) return 1;if(sb===undefined) return -1;
    return sa-sb;
  });
  var eligible=ranked.slice(0,numG);
  // Find max holes completed this round across eligible golfers
  var maxHoles=0;
  eligible.forEach(function(golfer){
    var hd=liveHoleScores[normName(golfer)];
    var roundData=hd&&hd[roundNum];
    var roundHoles=roundData&&roundData.strokes?roundData.strokes:null;
    if(roundHoles) maxHoles=Math.max(maxHoles,roundHoles.filter(function(h){return h!==null;}).length);
  });
  if(!maxHoles) return null;
  var teamRoundScore=0;
  for(var h=0;h<maxHoles;h++){
    var holeScores=eligible.map(function(golfer){
      var hd=liveHoleScores[normName(golfer)];
      var roundData=hd&&hd[roundNum];
      var roundHoles=roundData&&roundData.strokes?roundData.strokes:null;
      return roundHoles&&roundHoles[h]!==undefined&&roundHoles[h]!==null?roundHoles[h]:null;
    }).filter(function(s){return s!==null;});
    if(holeScores.length) teamRoundScore+=Math.min.apply(null,holeScores);
  }
  return {score:teamRoundScore,holesComplete:maxHoles,eligible:eligible};
}

function computeBestBallTotal(player){
  var g=state.games&&state.games.bestBall;
  if(!g||!g.enabled) return null;
  // Check which rounds have hole data available
  var roundNums=new Set();
  var picks=state.picks.filter(function(pk){return pk.player===player;}).map(function(pk){return pk.golfer;});
  picks.forEach(function(golfer){
    var hd=liveHoleScores[normName(golfer)]||{};
    Object.keys(hd).forEach(function(r){roundNums.add(parseInt(r,10));});
  });
  if(!roundNums.size) return null;
  var total=0;var roundsFound=0;
  roundNums.forEach(function(r){
    var res=computeBestBallRound(player,r);
    if(res&&res.holesComplete===18){total+=res.score;roundsFound++;}
    else if(res&&res.holesComplete>0){total+=res.score;roundsFound++;} // partial round counts too
  });
  return roundsFound?{total:total,rounds:roundsFound}:null;
}

function computePointsScore(player){
  var g=state.games&&state.games.points;
  if(!g||!g.enabled) return null;
  var table=g.table||DEFAULT_POINTS_TABLE;
  var numG=g.numGolfers||state.rosterSize;
  // Build position map with tie handling
  var sorted=Object.keys(liveScores).sort(function(a,b){return liveScores[a]-liveScores[b];});
  var posMap={};
  sorted.forEach(function(k,i){
    posMap[k]=(i>0&&liveScores[k]===liveScores[sorted[i-1]])?posMap[sorted[i-1]]:i+1;
  });
  var picks=state.picks.filter(function(pk){return pk.player===player&&!isCut(pk.golfer);}).map(function(pk){return pk.golfer;});
  var total=0;var counted=0;
  picks.forEach(function(golfer){
    if(counted>=numG) return;
    var pos=posMap[normName(golfer)];
    if(pos&&pos<=table.length){total+=table[pos-1]||0;}
    counted++;
  });
  return total;
}
