  [topTabs,botTabs].forEach(function(row,ri){
    var nav=el('nav',{class:'tabs-row'+(ri===1?' bottom':'')});
    if(ri===0) nav.style.marginTop='0.9rem';
    row.forEach(function(t){
      var b=btn(t[1],function(){setLocalView(t[0]);render();});
      if(localView===t[0]) b.classList.add('active');
      nav.appendChild(b);
    });
    app.appendChild(nav);
  });
}

function renderSetup(app){
  if(state.locked){
    var lockBanner=el('div',{style:'background:var(--masters-green);color:#fff;border-radius:6px;padding:0.9rem 1rem;margin-bottom:0.8rem;text-align:center'});
    lockBanner.appendChild(el('p',{style:'margin:0 0 4px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--masters-gold-light)',text:'Tournament in progress'}));
    lockBanner.appendChild(el('p',{style:'margin:0;font-family:\'Playfair Display\',serif;font-size:18px',text:'Teams are locked \uD83D\uDD12'}));
    app.appendChild(lockBanner);
    app.appendChild(el('p',{class:'small-muted',style:'margin:0 0 12px',text:'Head to Draft to view rosters or Scores to track the tournament.'}));
    if(isCommissioner){
      app.appendChild(btn('Unlock teams',function(){if(confirm('Unlock teams?')){state.locked=false;saveState();render();}},'full'));
    }
    return;
  }

  if(!isCommissioner){
    app.appendChild(el('p',{class:'small-muted',style:'margin-bottom:10px',text:'Only the commissioner can edit settings. Head to the Draft tab when it\u2019s your turn to pick.'}));
  }

  var card=el('div',{class:'card'});
  card.appendChild(el('label',{class:'field-label',text:'Players ('+state.players.length+'/'+state.numPlayers+')'}));
  state.players.forEach(function(p,i){
    var row=el('div',{class:'list-row'});
    row.appendChild(el('span',{text:p}));
    if(isCommissioner){
      var x=el('button',{class:'x-btn',text:'remove'});
      x.addEventListener('click',function(){state.players.splice(i,1);saveState();render();});
      row.appendChild(x);
    }
    card.appendChild(row);
  });
  if(isCommissioner&&state.players.length<state.numPlayers){
    var prow=el('div',{class:'row-flex',style:'margin-top:8px'});
    var pinput=el('input',{type:'text',placeholder:'Player name'});
    var paddbtn=btn('Add',function(){var v=pinput.value.trim();if(v){state.players.push(v);saveState();render();}});
    prow.appendChild(pinput);prow.appendChild(paddbtn);
    card.appendChild(prow);
    pinput.addEventListener('keydown',function(e){if(e.key==='Enter') paddbtn.click();});
  }
  app.appendChild(card);

  var gcard=el('div',{class:'card'});
  gcard.appendChild(el('label',{class:'field-label',text:'Golfer pool ('+state.golfers.length+' / min '+(state.rosterSize*state.numPlayers)+', max '+MAX_GOLFERS+')'}));
  if(isCommissioner){
    var importRow=el('div',{class:'row-flex',style:'margin-bottom:10px'});
    var importBtn=btn('Import this week\'s field from ESPN',function(){
      importBtn.textContent='Importing\u2026';importBtn.disabled=true;
      fetch(ESPN_URL).then(function(r){return r.json();}).then(function(data){
        var ev=data.events&&data.events[0];
        var comp=ev&&ev.competitions&&ev.competitions[0];
        var competitors=comp&&comp.competitors||[];
        if(!competitors.length){importStatus.textContent='No field found — try again closer to tournament start.';importStatus.style.color='var(--danger)';importBtn.textContent='Import this week\'s field from ESPN';importBtn.disabled=false;return;}
        var added=0,skipped=0;
        competitors.forEach(function(c){
          var nm=c.athlete&&(c.athlete.displayName||c.athlete.fullName);
          if(!nm) return;
          nm=nm.trim();
          if(state.golfers.indexOf(nm)===-1&&state.golfers.length<MAX_GOLFERS){state.golfers.push(nm);added++;}else skipped++;
        });
        saveState();
        importStatus.textContent='Imported '+added+' golfer(s) from '+(ev.name||'ESPN')+(skipped?' ('+skipped+' skipped)':'')+'.';
        importStatus.style.color='var(--masters-green)';
        importBtn.textContent='Re-import / refresh field';importBtn.disabled=false;render();
      }).catch(function(){importStatus.textContent='Could not reach ESPN. Check connection and try again.';importStatus.style.color='var(--danger)';importBtn.textContent='Import this week\'s field from ESPN';importBtn.disabled=false;});
    },'primary');
    importRow.appendChild(importBtn);
    gcard.appendChild(importRow);
    var importStatus=el('p',{class:'small-muted',style:'margin:0 0 8px',text:'Pulls the current PGA Tour field from ESPN. Works best Tue\u2013Sun of tournament week.'});
    gcard.appendChild(importStatus);
  }
  var glist=el('div',{class:'scrolly'});
  state.golfers.forEach(function(g,i){
    var row=el('div',{class:'list-row'});
    row.appendChild(el('span',{text:g}));
    if(isCommissioner){
      var x=el('button',{class:'x-btn',text:'remove'});
      x.addEventListener('click',function(){state.golfers.splice(i,1);saveState();render();});
      row.appendChild(x);
    }
    glist.appendChild(row);
  });
  gcard.appendChild(glist);
  if(isCommissioner){
    if(state.golfers.length<MAX_GOLFERS){
      var grow=el('div',{class:'row-flex',style:'margin-top:8px'});
      var ginput=el('input',{type:'text',placeholder:'Add golfer manually'});
      var gaddbtn=btn('Add',function(){var v=ginput.value.trim();if(v&&state.golfers.indexOf(v)===-1&&state.golfers.length<MAX_GOLFERS){state.golfers.push(v);saveState();ginput.value='';render();ginput.focus();}});
      grow.appendChild(ginput);grow.appendChild(gaddbtn);
      gcard.appendChild(grow);
      ginput.addEventListener('keydown',function(e){if(e.key==='Enter') gaddbtn.click();});
    }else{
      gcard.appendChild(el('p',{class:'small-muted',text:'Pool is full at '+MAX_GOLFERS+' golfers.'}));
    }
    if(state.golfers.length>0){
      var clearBtn=btn('Clear all golfers',function(){if(confirm('Remove all '+state.golfers.length+' golfers?')){state.golfers=[];saveState();render();}},'danger full');
      clearBtn.style.marginTop='8px';
      gcard.appendChild(clearBtn);
    }
  }
  app.appendChild(gcard);

  if(isCommissioner){
    var scard=el('div',{class:'card'});
    scard.appendChild(el('label',{class:'field-label',text:'Pool settings'}));
    function settingRow(labelText,value,min,max,onChange){
      var row=el('div',{class:'row-flex',style:'margin-bottom:10px'});
      row.appendChild(el('span',{text:labelText,style:'flex:1;font-size:14px'}));
      var wrap=el('div',{class:'row-flex',style:'gap:0'});
      var dn=el('button',{type:'button',class:'btn',style:'padding:6px 12px;border-radius:5px 0 0 5px;border-right:none'});
      dn.textContent='\u2212';
      var display=el('span',{style:'min-width:36px;text-align:center;font-size:16px;font-family:\'Playfair Display\',serif;padding:0 4px;border:1px solid var(--line);border-left:none;border-right:none;display:flex;align-items:center;justify-content:center'});
      display.textContent=value;
      var up=el('button',{type:'button',class:'btn',style:'padding:6px 12px;border-radius:0 5px 5px 0;border-left:none'});
      up.textContent='+';
      dn.addEventListener('click',function(){onChange(Math.max(min,value-1));});
      up.addEventListener('click',function(){onChange(Math.min(max,value+1));});
      wrap.appendChild(dn);wrap.appendChild(display);wrap.appendChild(up);
      row.appendChild(wrap);
      return row;
    }
    scard.appendChild(settingRow('Players in pool',state.numPlayers,2,10,function(v){if(v<state.players.length){alert('Remove players first.');return;}state.numPlayers=v;saveState();render();}));
    scard.appendChild(settingRow('Golfers per team',state.rosterSize,1,80,function(v){if(v<state.topScores) state.topScores=v;state.rosterSize=v;saveState();render();}));
    scard.appendChild(settingRow('Top scores that count',state.topScores,1,state.rosterSize,function(v){state.topScores=v;saveState();render();}));
    // Pick clock — direct input, 15 seconds to 6 hours (21600 seconds)
    var clockRow=el('div',{class:'row-flex',style:'margin-bottom:10px'});
    clockRow.appendChild(el('span',{style:'flex:1;font-size:14px',text:'Pick clock'}));
    var clockRight=el('div',{style:'display:flex;align-items:center;gap:6px'});
    var clockInp=el('input',{type:'number',min:'15',max:'21600',step:'1',style:'width:80px;text-align:right'});
    clockInp.value=state.pickClockSeconds;
    clockInp.addEventListener('change',function(){
      var v=parseInt(this.value,10);
      if(isNaN(v)) return;
      v=Math.max(15,Math.min(21600,v));
      this.value=v;
      state.pickClockSeconds=v;saveState();render();
    });
    // Helper to show human-readable time
    function fmtClock(s){
      if(s<60) return s+'s';
      if(s<3600) return Math.floor(s/60)+'m '+(s%60>0?s%60+'s':'');
      var h=Math.floor(s/3600);var m=Math.floor((s%3600)/60);
      return h+'h'+(m>0?' '+m+'m':'');
    }
    var clockHint=el('span',{class:'small-muted',style:'font-size:12px;min-width:52px',text:fmtClock(state.pickClockSeconds)});
    clockInp.addEventListener('input',function(){
      var v=parseInt(this.value,10);
      if(!isNaN(v)&&v>=15&&v<=21600) clockHint.textContent=fmtClock(v);
    });
    clockRight.appendChild(clockInp);
    clockRight.appendChild(el('span',{class:'small-muted',text:'sec'}));
    clockRight.appendChild(clockHint);
    clockRow.appendChild(clockRight);
    scard.appendChild(clockRow);
    scard.appendChild(el('p',{class:'small-muted',style:'margin:-4px 0 8px;font-size:11.5px',text:'Range: 15 seconds to 6 hours (21600 sec). Common: 90s, 120s, 300s (5 min), 3600 (1 hr).'}));
    app.appendChild(scard);

    // ── Games ──
    var gamesCard=el('div',{class:'card'});
    gamesCard.appendChild(el('label',{class:'field-label',text:'Games — toggle on/off, set wager per player'}));
    var gamesDefs=[
      {key:'lowScore',name:'Low Team Score',desc:'Team\u2019s best '+state.topScores+' golfer total scores combined. Lowest wins.'},
      {key:'leader',name:'Tournament Leader',desc:'Which team has the golfer who wins the actual tournament.'},
      {key:'bestBall',name:'Best Ball',desc:'Each hole, the team\u2019s lowest stroke score counts. Best combined round total wins.',extra:'bestBall'},
      {key:'points',name:'Points Leaderboard',desc:'Each golfer earns points based on their finishing position. Team with most points wins.',extra:'points'}
    ];
    gamesDefs.forEach(function(def){
      var gameState=state.games[def.key];
      var row=el('div',{class:'game-row'});
      // Toggle button
      var tog=el('button',{type:'button',class:'game-toggle-btn'+(gameState.enabled?' on':'')});
      tog.addEventListener('click',function(){
        gameState.enabled=!gameState.enabled;
        saveState();render();
      });
      row.appendChild(tog);
      var body=el('div',{class:'game-body'});
      body.appendChild(el('p',{class:'game-name'+(gameState.enabled?'':' off'),text:def.name}));
      body.appendChild(el('p',{class:'game-desc',text:def.desc}));
      if(gameState.enabled){
        var gs=el('div',{class:'game-settings'});
        // Wager per player
        var wr=el('div',{class:'game-wager-row'});
        wr.appendChild(el('span',{style:'font-size:13px',text:'$ per player (pot: $'+(gameState.wager*state.numPlayers)+')'}));
        var wi=el('input',{type:'number',min:'0',step:'1'});wi.value=gameState.wager;
        wi.addEventListener('change',function(){var v=parseInt(this.value,10);if(!isNaN(v)&&v>=0){gameState.wager=v;saveState();render();}});
        wr.appendChild(wi);gs.appendChild(wr);
        // Best ball extra settings
        if(def.extra==='bestBall'){
          var bbRow=el('div',{class:'row-flex',style:'margin-top:4px;gap:8px;align-items:center'});
          bbRow.appendChild(el('span',{style:'font-size:13px;flex:1',text:'Golfers eligible per team:'}));
          var bbWrap=el('div',{class:'row-flex',style:'gap:0'});
          var bbDn=el('button',{type:'button',class:'btn',style:'padding:4px 10px;border-radius:5px 0 0 5px;border-right:none;font-size:14px'});bbDn.textContent='\u2212';
          var bbDisp=el('span',{style:'min-width:32px;text-align:center;border:1px solid var(--line);border-left:none;border-right:none;padding:4px;font-family:\'Playfair Display\',serif'});bbDisp.textContent=gameState.numGolfers;
          var bbUp=el('button',{type:'button',class:'btn',style:'padding:4px 10px;border-radius:0 5px 5px 0;border-left:none;font-size:14px'});bbUp.textContent='+';
          bbDn.addEventListener('click',function(){gameState.numGolfers=Math.max(1,gameState.numGolfers-1);saveState();render();});
          bbUp.addEventListener('click',function(){gameState.numGolfers=Math.min(state.rosterSize,gameState.numGolfers+1);saveState();render();});
          bbWrap.appendChild(bbDn);bbWrap.appendChild(bbDisp);bbWrap.appendChild(bbUp);
          bbRow.appendChild(bbWrap);gs.appendChild(bbRow);
          gs.appendChild(el('p',{class:'small-muted',style:'margin-top:4px;font-size:11px',text:'Selects top '+gameState.numGolfers+' golfers by current score. On each hole, the lowest stroke count from any of those golfers counts for the team.'}));
          if(!liveEventId){
            gs.appendChild(el('p',{class:'small-muted',style:'margin-top:4px;color:var(--masters-gold)',text:'\u26a0\ufe0f Hole-by-hole data loads automatically once the tournament starts and scores are live.'}));
          }
        }
        // Points extra settings
        if(def.extra==='points'){
          var ptRow=el('div',{class:'row-flex',style:'margin-top:4px;gap:8px;align-items:center'});
          ptRow.appendChild(el('span',{style:'font-size:13px;flex:1',text:'Golfers that score points per team:'}));
          var ptWrap=el('div',{class:'row-flex',style:'gap:0'});
          var ptDn=el('button',{type:'button',class:'btn',style:'padding:4px 10px;border-radius:5px 0 0 5px;border-right:none;font-size:14px'});ptDn.textContent='\u2212';
          var ptDisp=el('span',{style:'min-width:32px;text-align:center;border:1px solid var(--line);border-left:none;border-right:none;padding:4px;font-family:\'Playfair Display\',serif'});ptDisp.textContent=gameState.numGolfers;
          var ptUp=el('button',{type:'button',class:'btn',style:'padding:4px 10px;border-radius:0 5px 5px 0;border-left:none;font-size:14px'});ptUp.textContent='+';
          ptDn.addEventListener('click',function(){gameState.numGolfers=Math.max(1,gameState.numGolfers-1);saveState();render();});
          ptUp.addEventListener('click',function(){gameState.numGolfers=Math.min(state.rosterSize,gameState.numGolfers+1);saveState();render();});
          ptWrap.appendChild(ptDn);ptWrap.appendChild(ptDisp);ptWrap.appendChild(ptUp);
          ptRow.appendChild(ptWrap);gs.appendChild(ptRow);
          // Points table editor (top 20 positions)
          gs.appendChild(el('p',{style:'font-size:11px;color:var(--ink-soft);margin:8px 0 4px;text-transform:uppercase;letter-spacing:0.06em',text:'Points per finishing position:'}));
          var ptGrid=el('div',{class:'points-grid'});
          for(var pi=0;pi<20;pi++){
            (function(idx){
              var cell=el('div',{class:'points-cell'});
              cell.appendChild(el('span',{class:'pos-label',text:(idx+1)+(idx===0?'st':idx===1?'nd':idx===2?'rd':'th')}));
              var inp=el('input',{type:'number',min:'0',step:'1'});inp.value=gameState.table[idx]||0;
              inp.addEventListener('change',function(){
                var v=parseInt(this.value,10);
                if(!isNaN(v)&&v>=0){gameState.table[idx]=v;saveState();}
              });
              cell.appendChild(inp);ptGrid.appendChild(cell);
            })(pi);
          }
          gs.appendChild(ptGrid);
        }
        body.appendChild(gs);
      }
      row.appendChild(body);
      gamesCard.appendChild(row);
    });
    // Total wager summary
    var enabledGames=gamesDefs.filter(function(d){return state.games[d.key].enabled;});
    if(enabledGames.length){
      var totalPerPlayer=enabledGames.reduce(function(s,d){return s+state.games[d.key].wager;},0);
      gamesCard.appendChild(el('p',{class:'small-muted',style:'margin-top:10px',text:'Total per player: $'+totalPerPlayer+' across '+enabledGames.length+' active game'+(enabledGames.length>1?'s':'')+'.'}));
    }
    app.appendChild(gamesCard);

    // Draft schedule
    var schCard=el('div',{class:'card'});
    schCard.appendChild(el('label',{class:'field-label',text:'Draft date & time'}));
    schCard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 8px',text:'Set when the draft will happen so players see a countdown on the Queue and Draft tabs.'}));
    var dtRow=el('div',{class:'row-flex'});
    var dtInput=el('input',{type:'datetime-local',style:'flex:1'});
    if(state.draftScheduled) dtInput.value=state.draftScheduled;
    dtInput.addEventListener('change',function(){state.draftScheduled=this.value||null;saveState();render();});
    dtRow.appendChild(dtInput);
    if(state.draftScheduled){
      var clrDt=btn('Clear',function(){state.draftScheduled=null;saveState();render();},'');
      clrDt.style.cssText='font-size:13px;padding:6px 12px;';
      dtRow.appendChild(clrDt);
    }
    schCard.appendChild(dtRow);
    if(state.draftScheduled){
      schCard.appendChild(el('p',{style:'margin:8px 0 0;font-size:13px;color:var(--masters-green)',text:'\uD83D\uDDD3\uFE0F '+formatDraftSchedule(state.draftScheduled)}));
    }
    app.appendChild(schCard);

    // Commissioner queue viewer — see all players' queues at a glance
    if(state.players.length>0&&state.golfers.length>0){
      var qvCard=el('div',{class:'card'});
      qvCard.appendChild(el('label',{class:'field-label',text:'All player queues'}));
      var allTakenQ=draftedNames().concat(Object.values(state.alts));
      var anyQueues=state.players.some(function(p){return state.queues&&state.queues[p]&&state.queues[p].length;});
      if(!anyQueues){
        qvCard.appendChild(el('p',{class:'small-muted',text:'No players have set a queue yet.'}));
      }else{
        var qvGrid=el('div',{class:'roster-grid'});
        state.players.forEach(function(p){
          var q=(state.queues&&state.queues[p])||[];
          var rc=el('div',{class:'roster-card'});
          var nameRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:4px'});
          nameRow.appendChild(el('p',{class:'pname',style:'margin:0',text:p}));
          if(state.queuePasswords&&state.queuePasswords[p]) nameRow.appendChild(el('span',{style:'font-size:10px;color:var(--masters-gold)',text:'\uD83D\uDD12'}));
          rc.appendChild(nameRow);
          if(!q.length){
            rc.appendChild(el('p',{class:'gname',style:'font-style:italic',text:'No queue set'}));
          }else{
            q.forEach(function(g,i){
              var taken=allTakenQ.indexOf(g)>-1;
              var gp=el('p',{class:'gname',style:taken?'text-decoration:line-through;opacity:0.5':'',text:(i+1)+'. '+g+(taken?' \u2713':'')});
              rc.appendChild(gp);
            });
          }
          qvGrid.appendChild(rc);
        });
        qvCard.appendChild(qvGrid);
      }
      app.appendChild(qvCard);
    }

    // Queue password management — lets commissioner unlock any player
    var pwdPlayers=state.players.filter(function(p){return state.queuePasswords&&state.queuePasswords[p];});
    var qmCard=el('div',{class:'card'});
    qmCard.appendChild(el('label',{class:'field-label',text:'Reset player passwords'}));
    if(!pwdPlayers.length){
      qmCard.appendChild(el('p',{class:'small-muted',text:'No players have set a queue password yet.'}));
    }else{
      qmCard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 8px',text:'Remove a player\'s password if they\'re locked out or need a reset. They can set a new one via Player login.'}));
      pwdPlayers.forEach(function(p){
        var row=el('div',{class:'list-row'});
        var left=el('div');
        left.appendChild(el('span',{text:p}));
        left.appendChild(el('span',{style:'font-size:12px;color:var(--ink-soft);margin-left:6px',text:'\uD83D\uDD12 password set'}));
        row.appendChild(left);
        var rmPwBtn=btn('Remove password',function(){
          if(confirm('Remove the queue password for '+p+'? They will need to set a new one in the Queue tab.')){
            delete state.queuePasswords[p];
            savePlayerQueue(p);
            render();
          }
        },'danger');
        rmPwBtn.style.cssText='font-size:12px;padding:4px 10px;';
        row.appendChild(rmPwBtn);
        qmCard.appendChild(row);
      });
    }
    app.appendChild(qmCard);
  }else{
    var roCard=el('div',{class:'card'});
    roCard.appendChild(el('label',{class:'field-label',text:'Pool settings'}));
    roCard.appendChild(el('p',{class:'small-muted',style:'margin:2px 0',text:state.numPlayers+' players \u00b7 '+state.rosterSize+' golfers per team \u00b7 top '+state.topScores+' scores count'}));
    var activeGames=Object.keys(state.games).filter(function(k){return state.games[k].enabled;});
    var gameNames={lowScore:'Low Score',leader:'Leader',bestBall:'Best Ball',points:'Points'};
    activeGames.forEach(function(k){
      roCard.appendChild(el('p',{class:'small-muted',style:'margin:2px 0',text:gameNames[k]+': $'+state.games[k].wager+' per player'}));
    });
    app.appendChild(roCard);
  }

  var canStart=state.players.length===state.numPlayers&&state.golfers.length>=state.rosterSize*state.numPlayers;
  var draftDone=state.picks.length>=state.rosterSize*state.numPlayers&&Object.keys(state.alts).length>=state.numPlayers;
  if(isCommissioner){
    // Readiness status
    if(!canStart){
      var need=Math.max(0,state.rosterSize*state.numPlayers-state.golfers.length);
      var msg=state.players.length<state.numPlayers?('Add '+(state.numPlayers-state.players.length)+' more player(s).'):(need>0?('Add '+need+' more golfer(s) \u2014 need '+(state.rosterSize*state.numPlayers)+' total.'):'');
      if(msg) app.appendChild(el('p',{class:'small-muted',text:msg}));
    }else if(!state.draftStarted){
      var readyCard=el('div',{style:'background:rgba(0,89,44,0.07);border:1px solid var(--masters-green);border-radius:6px;padding:0.9rem 1rem;margin-bottom:0.8rem'});
      readyCard.appendChild(el('p',{style:'margin:0;font-size:14px;color:var(--masters-green-dark)',text:'\u2713 Setup complete \u2014 head to the Draft tab to start when ready.'}));
      app.appendChild(readyCard);
      // Randomize order here is fine while draft hasn't started
      if(state.players.length>=2){
        var randBtn=btn('\uD83D\uDD00 Randomize draft order',function(){
          for(var i=state.players.length-1;i>0;i--){
            var j=Math.floor(Math.random()*(i+1));
            var tmp=state.players[i];state.players[i]=state.players[j];state.players[j]=tmp;
          }
          saveState();render();
        },'full');
        randBtn.style.marginBottom='6px';
        app.appendChild(randBtn);
      }
    }else if(state.draftStarted&&!draftDone){
      app.appendChild(el('p',{class:'small-muted',text:'Draft is in progress \u2014 go to the Draft tab.'}));
    }
    if(draftDone){
      var lkBtn=btn('Lock teams \uD83D\uDD12 (tournament starting)',function(){if(confirm('Lock all teams? Do this Thursday morning.')){state.locked=true;saveState();render();}},'gold full');
      lkBtn.style.marginTop='6px';app.appendChild(lkBtn);
    }
    if(state.picks.length>0){
    if(state.picks.length>0||state.draftStarted){
      var draftRstBtn=btn('Reset draft picks only',function(){
        if(confirm('This clears all picks, alts, cuts and draft state — but keeps your players, golfer pool, and settings intact. Continue?')){
          state.picks=[];
          state.alts={};state.altActive={};state.altReplacing={};
          state.cuts={};state.autodraftPlayers={};
          state.draftStarted=false;state.clockStartedAt=null;
          state.clockPaused=false;state.clockPauseRemaining=null;
          state.locked=false;
          performReset(state);
        }
      },'danger full');
      draftRstBtn.style.marginTop='6px';app.appendChild(draftRstBtn);
    }
      var rstBtn=btn('Reset everything',function(){if(confirm('Clear all players, golfers, picks and alts?')){performReset(defaultState());}},'danger full');
      rstBtn.style.marginTop='6px';app.appendChild(rstBtn);
    }
  }
}

function renderQueue(app){
  draftScheduleBanner(app);
  if(!state.players.length){
    app.appendChild(el('p',{class:'small-muted',text:'Add players in Setup first, then return here to set your queue and game opt-ins.'}));
    return;
  }

  // Use the same player identity system as the header button
  var myName=getVerifiedIdentity()||getMyName();
  function saveQ(){savePlayerQueue(myName);}

  if(!myName||state.players.indexOf(myName)===-1){
    app.appendChild(el('p',{class:'small-muted',style:'font-style:italic',text:'Tap \u201cPlayer login\u201d in the top right to access your queue and game preferences.'}));
    return;
  }

  // ── Password gate ──
  var hasPassword=!!(state.queuePasswords&&state.queuePasswords[myName]);
  var authed=isQueueAuthed(myName);

  if(hasPassword&&!authed){
    // Password needed — redirect to header login button
    app.appendChild(el('p',{style:'font-size:32px;text-align:center;margin:1rem 0 0.5rem',text:'\uD83D\uDD12'}));
    app.appendChild(el('p',{style:'font-family:\'Playfair Display\',serif;font-size:18px;text-align:center;margin:0 0 8px',text:myName+'\u2019s queue is protected'}));
    app.appendChild(el('p',{class:'small-muted',style:'text-align:center;font-style:italic',text:'Tap \u201cPlayer login\u201d in the top right and enter your password to access your queue.'}));
    return;
  }

  // Game opt-ins
  var draftStarted=state.draftStarted||state.picks.length>0;
  var activeGames=Object.keys(state.games).filter(function(k){return state.games[k].enabled;});
  if(activeGames.length){
    var gcard=el('div',{class:'card'});
    var gLabel=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:6px'});
    gLabel.appendChild(el('label',{class:'field-label',style:'margin:0',text:'Games you want to play'}));
    if(draftStarted) gLabel.appendChild(el('span',{style:'font-size:11px;color:#b0413e;font-weight:600',text:'\uD83D\uDD12 Locked — draft in progress'}));
    gcard.appendChild(gLabel);
    var pg=state.playerGames[myName]||{};
    var gLabels={lowScore:'Low Team Score',leader:'Tournament Leader',bestBall:'Best Ball',points:'Points Leaderboard'};
    activeGames.forEach(function(k){
      var row=el('div',{class:'opt-row',style:draftStarted?'opacity:0.7;cursor:default':''});
      var cb=el('input',{type:'checkbox'});
      cb.checked=pg[k]!==false;
      if(draftStarted){
        cb.disabled=true;
        cb.style.cursor='not-allowed';
      } else {
        cb.addEventListener('change',function(){
          if(!state.playerGames[myName]) state.playerGames[myName]={};
          state.playerGames[myName][k]=this.checked;
          saveQ();
        });
      }
      var lbl=el('label',{style:draftStarted?'flex:1;cursor:not-allowed':'cursor:pointer;flex:1'});
      lbl.textContent=gLabels[k]+' — $'+state.games[k].wager+'/player';
      if(!draftStarted){
        lbl.addEventListener('click',function(){cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));});
      }
      row.appendChild(cb);row.appendChild(lbl);
      gcard.appendChild(row);
    });
    if(draftStarted){
      gcard.appendChild(el('p',{class:'small-muted',style:'margin-top:8px;font-size:12px',text:'Game selections were locked when the draft started. Contact the commissioner if a change is needed.'}));
    }
    app.appendChild(gcard);
  }

  // Draft queue
  var allTaken=draftedNames().concat(Object.values(state.alts));
  var myQueue=(state.queues&&state.queues[myName])||[];
  var qcard=el('div',{class:'card'});
  qcard.appendChild(el('label',{class:'field-label',text:'Your draft queue (pick priority order)'}));
  qcard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 8px',text:'If the pick clock runs out, the system will auto-draft the first available player from this list. If your queue is empty or everyone in it is taken, it drafts the next player in the field.'}));

  if(myQueue.length){
    myQueue.forEach(function(g,i){
      var taken=allTaken.indexOf(g)>-1;
      var row=el('div',{class:'queue-row'});
      var left=el('div',{style:'flex:1;display:flex;align-items:center;gap:6px;min-width:0'});
      left.appendChild(el('span',{class:'queue-rank',text:(i+1)+'.'}));
      left.appendChild(el('span',{style:taken?'text-decoration:line-through;opacity:0.5':'',text:g}));
      if(taken) left.appendChild(el('span',{class:'small-muted',style:'font-size:11px',text:'(drafted)'}));
      row.appendChild(left);
      var btns=el('div',{class:'queue-btns'});
      if(i>0){
        var upBtn=el('button',{type:'button',text:'\u2191'});
        upBtn.addEventListener('click',function(){var q=state.queues[myName];var t=q[i];q[i]=q[i-1];q[i-1]=t;saveQ();render();});
        btns.appendChild(upBtn);
      }
      if(i<myQueue.length-1){
        var dnBtn=el('button',{type:'button',text:'\u2193'});
        dnBtn.addEventListener('click',function(){var q=state.queues[myName];var t=q[i];q[i]=q[i+1];q[i+1]=t;saveQ();render();});
        btns.appendChild(dnBtn);
      }
      var rmBtn=el('button',{type:'button',text:'\u2715'});
      rmBtn.addEventListener('click',function(){state.queues[myName].splice(i,1);saveQ();render();});
      btns.appendChild(rmBtn);
      row.appendChild(btns);
      qcard.appendChild(row);
    });
  } else {
    qcard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 8px;font-style:italic',text:'No queue set yet.'}));
  }

  // Add to queue
  var available=state.golfers.filter(function(g){return allTaken.indexOf(g)===-1&&myQueue.indexOf(g)===-1;});
  var srch=el('input',{type:'text',placeholder:'Search golfer to add to queue\u2026',style:'margin-top:10px'});
  qcard.appendChild(srch);
  var qlist=el('div',{class:'scrolly',style:'margin-top:6px'});
  function rebuildQList(f){
    qlist.innerHTML='';
    available.filter(function(g){return g.toLowerCase().indexOf(f.toLowerCase())>-1;}).slice(0,40).forEach(function(g){
      var b=el('button',{type:'button',class:'golfer-btn',text:'+ '+g});
      b.addEventListener('click',function(){
        if(!state.queues) state.queues={};
        if(!state.queues[myName]) state.queues[myName]=[];
        state.queues[myName].push(g);
        saveQ();render();
      });
      qlist.appendChild(b);
    });
  }
  rebuildQList('');
  srch.addEventListener('input',function(){rebuildQList(this.value);});
  qcard.appendChild(qlist);

  if(myQueue.length){
    var clr=btn('Clear my queue',function(){state.queues[myName]=[];saveQ();render();},'danger');
    clr.style.cssText='margin-top:8px;font-size:12px;padding:5px 10px;';
    qcard.appendChild(clr);
  }
  app.appendChild(qcard);

  // ── Password management ──
  var pwMgCard=el('div',{class:'card'});
  pwMgCard.appendChild(el('label',{class:'field-label',text:hasPassword?'Change or remove your queue password':'Protect your queue with a password'}));
  pwMgCard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 10px',text:hasPassword?'Your queue is currently password-protected. Enter a new password to change it, or remove it to leave your queue open.':'Optional: set a password so only you can edit your pick order and game choices. Passwords reset when the commissioner resets the pool.'}));

  if(hasPassword){
    // Change password
    var cpInput=el('input',{type:'password',placeholder:'New password'});
    var cpInput2=el('input',{type:'password',placeholder:'Confirm new password',style:'margin-top:6px'});
    pwMgCard.appendChild(cpInput);
    pwMgCard.appendChild(cpInput2);
    var cpErr=el('p',{style:'color:#b0413e;font-size:12px;margin:4px 0;min-height:16px',text:''});
    pwMgCard.appendChild(cpErr);
    var cpRow=el('div',{class:'row-flex',style:'margin-top:8px'});
    var cpBtn=btn('Change password',function(){
      var v=cpInput.value.trim();
      if(!v){cpErr.textContent='Password cannot be empty.';return;}
      if(v!==cpInput2.value){cpErr.textContent='Passwords don\u2019t match.';return;}
      if(!state.queuePasswords) state.queuePasswords={};
      state.queuePasswords[myName]=v;
      setQueueAuthed(myName);
      saveQ();render();
    },'primary');
    var rmBtn=btn('Remove password',function(){
      if(confirm('Remove the password for '+myName+'\u2019s queue? Anyone will be able to edit it.')){
        delete state.queuePasswords[myName];
        clearQueueAuthed(myName);
        saveQ();render();
      }
    },'danger');
    cpRow.appendChild(cpBtn);cpRow.appendChild(rmBtn);
    pwMgCard.appendChild(cpRow);
    // Lock out button
    var lockOutBtn=btn('Lock queue (sign out)',function(){clearQueueAuthed(myName);render();},'');
    lockOutBtn.style.cssText='margin-top:8px;font-size:12px;padding:5px 10px;width:100%';
    pwMgCard.appendChild(lockOutBtn);
  } else {
    // Set new password
    var spInput=el('input',{type:'password',placeholder:'Choose a password'});
    var spInput2=el('input',{type:'password',placeholder:'Confirm password',style:'margin-top:6px'});
    pwMgCard.appendChild(spInput);
    pwMgCard.appendChild(spInput2);
    var spErr=el('p',{style:'color:#b0413e;font-size:12px;margin:4px 0;min-height:16px',text:''});
    pwMgCard.appendChild(spErr);
    var spBtn=btn('Set password',function(){
      var v=spInput.value.trim();
      if(!v){spErr.textContent='Password cannot be empty.';return;}
      if(v!==spInput2.value){spErr.textContent='Passwords don\u2019t match.';return;}
      if(!state.queuePasswords) state.queuePasswords={};
      state.queuePasswords[myName]=v;
      setQueueAuthed(myName);
      saveQ();render();
    },'primary full');
    spBtn.style.marginTop='8px';
    pwMgCard.appendChild(spBtn);
  }
  app.appendChild(pwMgCard);

  // ── Best Ball daily lineup selection ──
  if(state.games&&state.games.bestBall&&state.games.bestBall.enabled){
    var myPG=state.playerGames&&state.playerGames[myName];
    var optedIn=!myPG||myPG.bestBall!==false;
    if(optedIn){
      var numG=state.games.bestBall.numGolfers||5;
      var myPicks=state.picks.filter(function(pk){return pk.player===myName&&!isCut(pk.golfer);}).map(function(pk){return pk.golfer;});
      if(myPicks.length){
        var bbCard=el('div',{class:'card'});
        bbCard.appendChild(el('label',{class:'field-label',text:'Best ball daily lineup'}));
        var bbInfo=el('div',{style:'background:var(--cream-2);border-radius:5px;padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between'});
        bbInfo.appendChild(el('span',{style:'font-size:13px',text:'Golfers per round (set by commissioner):'}));
        bbInfo.appendChild(el('span',{style:'font-family:\'Playfair Display\',serif;font-size:18px;font-weight:600;color:var(--masters-green-dark)',text:numG+''}));
        bbCard.appendChild(bbInfo);
        bbCard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 10px',text:'Choose exactly '+numG+' golfer'+(numG===1?'':'s')+' from your team for each round\'s best ball. If left unset, the system auto-selects your top '+numG+' by score.'}));
        [1,2,3,4].forEach(function(rn){
          var myLineup=(state.bestBallLineups&&state.bestBallLineups[myName]&&state.bestBallLineups[myName][rn])||[];
          var isLocked=!!(state.bbLineupLocks&&state.bbLineupLocks[rn]);
          var roundSec=el('div',{style:'margin-bottom:14px'});
          var rHead=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'});
          rHead.appendChild(el('span',{style:'font-size:13px;font-weight:600;color:var(--masters-green-dark)',text:'Round '+rn}));
          var badge;
          if(isLocked){
            badge=el('span',{style:'font-size:11px;background:#fce4e4;color:#7a2222;padding:2px 8px;border-radius:3px',text:'\uD83D\uDD12 Locked by commissioner'});
          }else if(myLineup.length===numG){
            badge=el('span',{style:'font-size:11px;background:rgba(0,89,44,0.15);color:var(--masters-green-dark);padding:2px 8px;border-radius:3px',text:'\u2714 '+myLineup.length+'/'+numG+' set'});
          }else if(myLineup.length){
            badge=el('span',{style:'font-size:11px;background:#fff3e0;color:#7a5800;padding:2px 8px;border-radius:3px',text:myLineup.length+'/'+numG+' \u2014 pick '+(numG-myLineup.length)+' more'});
          }else{
            badge=el('span',{class:'small-muted',style:'font-size:11px',text:'Auto-select (0/'+numG+')'});
          }
          rHead.appendChild(badge);
          roundSec.appendChild(rHead);

          if(isLocked){
            // Show current lineup read-only
            if(myLineup.length){
              myLineup.forEach(function(g,i){roundSec.appendChild(el('p',{style:'font-size:13px;color:var(--ink-soft);margin:2px 0',text:(i+1)+'. '+g}));});
            }else{
              roundSec.appendChild(el('p',{class:'small-muted',style:'font-style:italic',text:'No lineup set — will auto-select top '+numG+' by score.'}));
            }
          }else{
            // Editable checkboxes
            var selected=myLineup.slice();
            myPicks.forEach(function(g){
              var isChecked=selected.indexOf(g)>-1;
              var cbRow=el('div',{style:'display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)'});
              var cb=el('input',{type:'checkbox'});
              cb.checked=isChecked;
              if(!isChecked&&selected.length>=numG) cb.disabled=true;
              cb.addEventListener('change',function(){
                if(this.checked){if(selected.indexOf(g)===-1&&selected.length<numG) selected.push(g);else{this.checked=false;return;}}
                else{var idx=selected.indexOf(g);if(idx>-1) selected.splice(idx,1);}
                if(!state.bestBallLineups) state.bestBallLineups={};
                if(!state.bestBallLineups[myName]) state.bestBallLineups[myName]={};
                state.bestBallLineups[myName][rn]=selected.slice();
                saveBBLineup(myName);render();
              });
              cbRow.appendChild(cb);
              var lbl=el('label',{style:'flex:1;cursor:pointer;font-size:14px'});
              lbl.textContent=g;
              var sc=liveScores[normName(g)];
              if(sc!==undefined) lbl.textContent+='\u2002'+formatScore(sc);
              lbl.addEventListener('click',function(){cb.click();});
              cbRow.appendChild(lbl);
              roundSec.appendChild(cbRow);
            });
            if(myLineup.length){
              var clrR=btn('Clear Round '+rn+' lineup',function(){
                if(!state.bestBallLineups||!state.bestBallLineups[myName]) return;
                delete state.bestBallLineups[myName][rn];
                saveBBLineup(myName);render();
              },'');
              clrR.style.cssText='font-size:11px;padding:3px 8px;margin-top:6px;color:var(--ink-soft)';
              roundSec.appendChild(clrR);
            }
          }
          bbCard.appendChild(roundSec);
        });
        app.appendChild(bbCard);
      }
    }
  }
}

function renderDraft(app){
  draftScheduleBanner(app);
  if(state.players.length<state.numPlayers||state.golfers.length<state.rosterSize*state.numPlayers){
    app.appendChild(el('p',{class:'small-muted',text:'Finish setup first \u2014 return to the Setup tab.'}));return;
  }

  // ── Pre-draft: show Start button ──
  if(!state.draftStarted){
    var preCard=el('div',{class:'card',style:'text-align:center;padding:1.4rem 1rem'});
    preCard.appendChild(el('p',{style:'font-size:32px;margin:0 0 8px',text:'\uD83C\uDFCC\uFE0F'}));
    preCard.appendChild(el('p',{style:'font-family:\'Playfair Display\',serif;font-size:20px;margin:0 0 6px',text:'Ready to draft'}));
    preCard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 14px',text:state.players.join(' \u00b7 ')+' \u00b7 '+state.numPlayers+' rounds of '+state.rosterSize+' picks each'}));
    if(isCommissioner){
      // Clock setting reminder
      preCard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 12px;font-size:12px',text:'Pick clock: '+state.pickClockSeconds+'s per pick \u2014 adjust in Setup if needed.'}));
      var startBtn=btn('Start snake draft \u25b6',function(){
        if(confirm('Start the draft? The pick clock will begin immediately.')){
          state.draftStarted=true;
          state.autodraftPlayers={}; // always start fresh — no stale autodraft from previous sessions
          state.clockStartedAt=Date.now();
          state.clockPaused=false;state.clockPauseRemaining=null;
          saveState();render();
          // Note: checkAndAutoRunNext NOT called here — autodraft fires only when
          // a player explicitly toggles it on during the draft
        }
      },'primary full');
      preCard.appendChild(startBtn);
    }else{
      preCard.appendChild(el('p',{style:'font-size:14px;color:var(--ink-soft)',text:'Waiting for the commissioner to start the draft\u2026'}));
    }
    app.appendChild(preCard);
    // Still show rosters below so players can review
    app.appendChild(el('label',{class:'field-label',text:'Draft order',style:'display:block;margin:14px 2px 8px'}));
    var grid2=el('div',{class:'roster-grid'});
    // Compute exact pick numbers for each player from the snake order
    var fullOrder=snakeOrder(state.numPlayers,state.rosterSize);
    var playerPickNums={};
    state.players.forEach(function(p,i){playerPickNums[i]=[];});
    fullOrder.forEach(function(playerIdx,pos){playerPickNums[playerIdx].push(pos+1);});

    state.players.forEach(function(p,i){
      var rc=el('div',{class:'roster-card'});
      rc.appendChild(el('p',{class:'pname',text:(i+1)+'. '+p}));
      var nums=playerPickNums[i];
      // Show first few and ellipsis if many
      var display=nums.slice(0,5).join(', ')+(nums.length>5?'\u2026':'');
      rc.appendChild(el('p',{class:'gname',text:'Picks: '+display}));
      grid2.appendChild(rc);
    });
    app.appendChild(grid2);
    return;
  }

  if(state.locked){
    var lb=el('div',{style:'background:var(--masters-green);color:#fff;border-radius:6px;padding:0.8rem 1rem;margin-bottom:1rem;text-align:center'});
    lb.appendChild(el('p',{style:'margin:0;font-family:\'Playfair Display\',serif;font-size:16px',text:'\uD83D\uDD12 Teams are locked \u2014 tournament is underway'}));
    app.appendChild(lb);
  }

  // ── Commissioner controls panel ──
  if(isCommissioner&&state.draftStarted&&!state.locked){
    var ctrlCard=el('div',{class:'card',style:'padding:0.75rem 1rem;margin-bottom:0.75rem'});
    ctrlCard.appendChild(el('label',{class:'field-label',style:'margin-bottom:8px',text:'Commissioner controls'}));
    // Clock on/off toggle
    var clkRow=el('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)'});
    clkRow.appendChild(el('span',{style:'font-size:14px',text:'Pick clock'}));
    var clkRight=el('div',{style:'display:flex;align-items:center;gap:8px'});
    clkRight.appendChild(el('span',{class:'small-muted',text:state.clockEnabled?'ON':'OFF'}));
    var clkTog=el('button',{type:'button',class:'game-toggle-btn'+(state.clockEnabled?' on':'')});
    clkTog.addEventListener('click',function(){
      state.clockEnabled=!state.clockEnabled;
      if(!state.clockEnabled){state.clockPaused=false;state.clockPauseRemaining=null;}
      saveState();render();
    });
    clkRight.appendChild(clkTog);
    clkRow.appendChild(clkRight);
    ctrlCard.appendChild(clkRow);
    // Clock action buttons (only when clock is on)
    if(state.clockEnabled){
      var ctrlRow=el('div',{class:'row-flex',style:'gap:6px;flex-wrap:wrap'});
      if(state.clockPaused){
        var resumeBtn=btn('\u25b6 Resume clock',function(){resumeClock();},'primary');
        resumeBtn.style.cssText='flex:1;font-size:13px;padding:7px 10px';
        ctrlRow.appendChild(resumeBtn);
      }else{
        var pauseBtn=btn('\u23f8 Pause clock',function(){pauseClock();},'');
        pauseBtn.style.cssText='flex:1;font-size:13px;padding:7px 10px';
        ctrlRow.appendChild(pauseBtn);
      }
      var resetClockBtn=btn('\u21ba Reset clock',function(){resetClock();},'');
      resetClockBtn.style.cssText='flex:1;font-size:13px;padding:7px 10px';
      ctrlRow.appendChild(resetClockBtn);
      ctrlCard.appendChild(ctrlRow);
    }
    // Reset draft picks
    var draftRstBtn2=btn('\uD83D\uDDD1 Reset draft picks',function(){
      if(confirm('Clear all picks, alts and cuts — keep players, golfer pool and settings?')){
        state.picks=[];
        state.alts={};state.altActive={};state.altReplacing={};
        state.cuts={};state.autodraftPlayers={};
        state.draftStarted=false;state.clockStartedAt=null;
        state.clockPaused=false;state.clockPauseRemaining=null;
        state.locked=false;
        performReset(state);
      }
    },'danger full');
    draftRstBtn2.style.cssText='margin-top:8px;font-size:13px;';
    ctrlCard.appendChild(draftRstBtn2);
    app.appendChild(ctrlCard);
  }

  var mainOrder=snakeOrder(state.numPlayers,state.rosterSize);
  var mainDone=state.picks.length>=mainOrder.length;
  var altsDone=Object.keys(state.alts).length>=state.numPlayers;
  var altOrder=snakeOrder(state.numPlayers,state.rosterSize+1).slice(state.numPlayers*state.rosterSize);
  var altsPickedSoFar=Object.keys(state.alts).length;
  var allTaken=draftedNames().concat(Object.values(state.alts));

  // Player identity bar — non-commissioners must identify to pick
  var draftIdentity=renderPlayerIdentityBar(app); // '' if not identified, playerName if verified

  if(mainDone&&altsDone){
    app.appendChild(el('p',{class:'serif-head',style:'font-size:18px;margin:0 0 12px',text:'Draft complete \u2714'}));
  }else if(!mainDone&&!state.locked){
    var idx=state.picks.length;
    var onClockIdx=mainOrder[idx];
    var round=Math.floor(idx/state.numPlayers)+1;
    var pickInRound=(idx%state.numPlayers)+1;
    var pc=el('div',{class:'pick-card'});
    pc.appendChild(el('p',{class:'eyebrow',text:'Round '+round+' \u00b7 Pick '+pickInRound}));
    pc.appendChild(el('p',{class:'onclock',text:state.players[onClockIdx]+' is on the clock'}));
    var onClockPlayer=state.players[onClockIdx];
    if(state.autodraftPlayers&&state.autodraftPlayers[onClockPlayer]){
      pc.appendChild(el('p',{style:'margin:4px 0 0;font-size:13px;color:var(--masters-gold)',text:'\u26a1 Autodraft is on \u2014 picking automatically from queue\u2026'}));
    }
    // Clock display
    if(state.clockStartedAt&&state.pickClockSeconds){
      var rem0,sec0,col0;

        rem0=typeof state.clockPauseRemaining==='number'?state.clockPauseRemaining:state.pickClockSeconds;
        sec0=Math.ceil(rem0);col0='#c9a227';
      }else{

    var card=el('div',{class:'card'});

    var list=el('div',{class:'scrolly',style:'margin-top:8px'});
    card.appendChild(list);app.appendChild(card);
    function renderMainList(f){
      list.innerHTML='';
      if(!isMyTurn){
        // Not your turn — show waiting state
        var whosTurn=state.players[onClockIdx];
        var waitEl=el('div',{style:'text-align:center;padding:20px 12px'});

      available.filter(function(g){return g.toLowerCase().indexOf(f.toLowerCase())>-1;}).forEach(function(g){
        var b=el('button',{type:'button',class:'golfer-btn',text:g});
        b.addEventListener('touchstart',function(){b.classList.add('tapped');},{passive:true});
        b.addEventListener('touchend',function(){b.classList.remove('tapped');},{passive:true});
        b.addEventListener('click',function(){
          if(pickInProgress) return;
          if(state.clockPaused&&!isCommissioner) return;
          pickInProgress=true;
          draftSearchValue='';
          list.classList.add('pick-processing');
          state.picks.push({player:state.players[onClockIdx],golfer:g});
          state.clockStartedAt=Date.now();
          state.clockPaused=false;state.clockPauseRemaining=null;
          saveState();render();
          checkAndAutoRunNext();
          setTimeout(function(){pickInProgress=false;},2000);
        });
        list.appendChild(b);
      });
      if(state.clockPaused&&!isCommissioner){
        list.appendChild(el('p',{class:'small-muted',style:'text-align:center;padding:12px',text:'\u23f8 Draft is paused by the commissioner.'}));
      }
    }
    renderMainList(draftSearchValue); // render with preserved filter
    search.addEventListener('input',function(){draftSearchValue=this.value;renderMainList(this.value);});
  }else if(mainDone&&!altsDone&&!state.locked){
    var altIdx=altsPickedSoFar;
    var altOnClockIdx=altOrder[altIdx];
    var altPlayer=state.players[altOnClockIdx];
    var pc2=el('div',{class:'pick-card'});
    pc2.appendChild(el('p',{class:'eyebrow',text:'Alt round \u00b7 Pick '+(altIdx+1)}));
    pc2.appendChild(el('p',{class:'onclock',text:altPlayer+' picks their alt'}));
    pc2.appendChild(el('p',{style:'font-size:12px;color:var(--ink-soft);margin:4px 0 0',text:'Alt only counts if a golfer WDs before the tournament and the commissioner activates it.'}));
    app.appendChild(pc2);
    var available2=state.golfers.filter(function(g){return allTaken.indexOf(g)===-1;});
    var isMyAltTurn=isCommissioner||(draftIdentity&&draftIdentity===altPlayer);
    var card2=el('div',{class:'card'});
    var search2=el('input',{type:'text',placeholder:'Search golfer'});
    card2.appendChild(search2);
    var list2=el('div',{class:'scrolly',style:'margin-top:8px'});
    card2.appendChild(list2);app.appendChild(card2);
    function renderAltList(f){
      list2.innerHTML='';
      if(!isMyAltTurn){
        var waitEl2=el('div',{style:'text-align:center;padding:20px 12px'});
        waitEl2.appendChild(el('p',{style:'font-size:15px;color:var(--ink-soft);margin:0',text:'\u23f3 Waiting for '+altPlayer+' to pick their alt\u2026'}));
        list2.appendChild(waitEl2);

      }
      available2.filter(function(g){return g.toLowerCase().indexOf(f.toLowerCase())>-1;}).forEach(function(g){
        var b=el('button',{type:'button',class:'golfer-btn',text:g});
        b.addEventListener('click',function(){state.alts[altPlayer]=g;saveState();render();});
        list2.appendChild(b);

    renderAltList('');
    search2.addEventListener('input',function(){renderAltList(search2.value);});

  app.appendChild(el('label',{class:'field-label',text:'Rosters so far',style:'display:block;margin:14px 2px 8px'}));
  var grid=el('div',{class:'roster-grid'});
  state.players.forEach(function(p){
    var picksForP=state.picks.filter(function(pk){return pk.player===p;});
    var rc=el('div',{class:'roster-card'});
    rc.appendChild(el('p',{class:'pname',text:p+' ('+picksForP.length+'/'+state.rosterSize+')'}));
    picksForP.forEach(function(pk){
      var g=pk.golfer;
      var isWd=state.altActive[p]&&state.altReplacing[p]===g;
      var nameEl=el('p',{class:'gname',style:isWd?'text-decoration:line-through;opacity:0.65':''});

      if(pk.manual) nameEl.appendChild(el('span',{class:'autodraft-badge',style:'background:#4a5a4c',text:'manual'}));
      rc.appendChild(nameEl);
    });
    if(state.alts[p]){
      rc.appendChild(el('p',{class:'gname',style:'color:var(--masters-gold);font-style:italic',text:'ALT: '+state.alts[p]+(state.altActive&&state.altActive[p]?' \u2605':'')}));
    }
    grid.appendChild(rc);
  });
  app.appendChild(grid);

  // ── Autodraft toggles ──
  if(state.draftStarted&&!mainDone){
    var adCard=el('div',{class:'card',style:'padding:0.75rem 1rem;margin-top:6px'});
    var adTitle=state.clockEnabled?
      'Autodraft \u2014 skip the clock, pick instantly from queue':
      'Autodraft \u2014 pick from queue automatically (clock is off)';
    adCard.appendChild(el('label',{class:'field-label',style:'margin-bottom:6px',text:adTitle}));
    adCard.appendChild(el('p',{class:'small-muted',style:'margin:0 0 10px',text:state.clockEnabled?
      'ON: picks automatically from your queue when your turn starts. OFF: you pick manually — but if the clock runs out, your queue is still used as the tiebreaker.':
      'Clock is off. Players with autodraft on will pick automatically from their queue each turn.'}));
    state.players.forEach(function(p){
      var isOn=!!(state.autodraftPlayers&&state.autodraftPlayers[p]);
      // Commissioner can toggle anyone; players can toggle only themselves
      var canToggle=isCommissioner||(draftIdentity&&draftIdentity===p);
      var row=el('div',{style:'display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)'});
      var left=el('div',{style:'display:flex;align-items:center;gap:8px'});

      if(isOn) left.appendChild(el('span',{class:'autodraft-badge',text:'auto on'}));
      row.appendChild(left);
      if(canToggle){
        var togBtn=el('button',{type:'button',class:'game-toggle-btn'+(isOn?' on':''),style:'flex-shrink:0'});
        togBtn.addEventListener('click',function(){
          if(!state.autodraftPlayers) state.autodraftPlayers={};

          if(!isOn){

          }

      }else{

      }

    app.appendChild(adCard);
  }
  if(!state.locked){
    if(state.picks.length>0&&!mainDone){
      app.appendChild(btn('Undo last pick',function(){state.picks.pop();state.undoVersion=Date.now();saveState();render();},'full'));
    }else if(mainDone&&!altsDone&&altsPickedSoFar>0){

    }
  }
}

function isCut(g){return!!(state.cuts&&state.cuts[normName(g)]);}
function toggleCut(g){
  if(!isCommissioner) return;
  var key=normName(g);
  if(!state.cuts) state.cuts={};
  if(state.cuts[key]) delete state.cuts[key];else state.cuts[key]=true;
  saveState();render();
}
function ownerOf(g){
  var pk=state.picks.find(function(pk){return pk.golfer===g;});
  return pk?pk.player:'';
}
function scoreFor(g){
  if(isCut(g)) return undefined;
  var key=normName(g);
  if(liveScores.hasOwnProperty(key)) return liveScores[key];
  return undefined;
}

function teamResults(){
  return state.players.map(function(p){
    var picksForP=state.picks.filter(function(pk){return pk.player===p;}).map(function(pk){return pk.golfer;});
    var withdrawnGolfer=null,altInUse=null;
    if(state.altActive[p]&&state.altReplacing[p]&&state.alts[p]){
      withdrawnGolfer=state.altReplacing[p];altInUse=state.alts[p];
      picksForP=picksForP.filter(function(g){return g!==withdrawnGolfer;});
      picksForP.push(altInUse);
    }
    var active=picksForP.filter(function(g){return!isCut(g);});
    var cut=picksForP.filter(function(g){return isCut(g);});
    var scoredActive=active.map(function(g){return{golfer:g,score:scoreFor(g),cut:false,alt:g===altInUse};}).filter(function(x){return x.score!==undefined;}).sort(function(a,b){return a.score-b.score;});
    var unscoredActive=active.filter(function(g){return scoreFor(g)===undefined;}).map(function(g){return{golfer:g,score:undefined,cut:false,alt:g===altInUse};});
    var cutList=cut.map(function(g){return{golfer:g,score:undefined,cut:true,alt:false};});
    var wdList=withdrawnGolfer?[{golfer:withdrawnGolfer,score:undefined,cut:false,wd:true}]:[];
    var topN=scoredActive.slice(0,state.topScores);
    var rest=scoredActive.slice(state.topScores).concat(unscoredActive).concat(cutList).concat(wdList);
    var hasEnough=active.length>=state.topScores;
    var total=hasEnough?topN.reduce(function(s,x){return s+x.score;},0):null;
    return{player:p,top5:topN,rest:rest,total:total,hasEnough:hasEnough,scoredCount:scoredActive.length,activeCount:active.length};
  });
}

function renderPresenter(app){
  var mainOrder=state.draftStarted?snakeOrder(state.numPlayers,state.rosterSize):[];
  var idx=state.picks.length;
  var mainDone=idx>=mainOrder.length;
  var wrap=el('div',{class:'presenter-wrap'});

  // Header
  wrap.appendChild(el('p',{class:'p-eyebrow',text:'A tradition unlike any other'}));
  var poolName=(currentPoolId&&poolsMeta[currentPoolId]&&poolsMeta[currentPoolId].name)||'The Pool';
  wrap.appendChild(el('p',{class:'p-pool-name',text:poolName}));

  if(!state.draftStarted){
    wrap.appendChild(el('p',{class:'p-on-clock',style:'font-size:clamp(24px,5vw,60px)',text:'Draft starting soon\u2026'}));
    if(state.draftScheduled) wrap.appendChild(el('p',{class:'p-round-label',text:formatDraftSchedule(state.draftScheduled)}));
  }else if(mainDone){
    wrap.appendChild(el('p',{class:'p-on-clock',style:'font-size:clamp(24px,5vw,60px)',text:'Draft Complete \u2714'}));
  }else{
    var round=Math.floor(idx/state.numPlayers)+1;
    var total=state.numPlayers*state.rosterSize;
    wrap.appendChild(el('p',{class:'p-round-label',text:'Round '+round+' \u00b7 Overall Pick '+(idx+1)+' of '+total}));

    var onClockPlayer=state.players[mainOrder[idx]];
    var hasAutodraft=state.autodraftPlayers&&state.autodraftPlayers[onClockPlayer];
    wrap.appendChild(el('p',{class:'p-on-clock',text:onClockPlayer}));
    wrap.appendChild(el('p',{class:'p-sub-label',text:hasAutodraft?'is autodrafting\u2026':'is on the clock'}));

    // Clock
    if(state.clockEnabled&&state.clockStartedAt&&!state.clockPaused){
      var elp=(Date.now()-state.clockStartedAt)/1000;
      var rem=Math.max(0,state.pickClockSeconds-elp);
      var sec=Math.ceil(rem);
      var col=sec<=10?'#e53935':sec<=30?'#c9a227':'#66bb6a';
      wrap.appendChild(el('p',{id:'presenter-clock-num',class:'p-clock-num',style:'color:'+col,text:sec+'s'}));
      var bw=el('div',{class:'p-clock-bar-wrap'});
      bw.appendChild(el('div',{id:'presenter-clock-bar',class:'p-clock-bar',style:'width:'+((rem/state.pickClockSeconds)*100)+'%;background:'+col}));
      wrap.appendChild(bw);
    }else if(state.clockPaused){
      wrap.appendChild(el('p',{class:'p-clock-num',style:'color:#c9a227;font-size:clamp(22px,4vw,48px)',text:'\u23f8 Paused'}));
    }else if(!state.clockEnabled){
      wrap.appendChild(el('p',{style:'text-align:center;font-size:clamp(12px,1.6vw,18px);color:rgba(255,255,255,0.35);margin:4px 0 12px',text:'No pick clock'}));
    }

    // Last pick
    if(state.picks.length>0){
      var lp=state.picks[state.picks.length-1];
      var lpNum=state.picks.length;
      var lpRound=Math.floor((lpNum-1)/state.numPlayers)+1;
      var lpCard=el('div',{class:'p-last-pick'});
      lpCard.appendChild(el('p',{class:'pick-label',text:'\u2714 Round '+lpRound+' \u00b7 Pick '+lpNum+(lp.autodrafted?' (auto)':lp.manual?' (manual)':'')}));
      lpCard.appendChild(el('p',{class:'pick-text',text:lp.golfer+' \u2192 '+lp.player}));
      wrap.appendChild(lpCard);
    }
  }

  // Team rosters — dynamic font scaling so all teams always fit on screen
  var rosters=el('div',{class:'p-rosters'});
  var curPlayer=!mainDone&&state.draftStarted?state.players[mainOrder[idx]]:null;

  // Calculate fill level to scale fonts down as picks accumulate
  var maxPicksOnTeam=state.players.reduce(function(max,p){
    return Math.max(max,state.picks.filter(function(pk){return pk.player===p;}).length);
  },0);
  var fillRatio=state.rosterSize>0?maxPicksOnTeam/state.rosterSize:0;
  // Font sizes scale from large (empty) down to compact (full roster)
  var nameFontSize='clamp('+(fillRatio>0.5?'10':'12')+'px,'+(fillRatio>0.7?'1.2':'1.6')+'vw,'+(fillRatio>0.7?'16':'20')+'px)';
  var pickFontSize='clamp('+(fillRatio>0.7?'8':'9')+'px,'+(fillRatio>0.5?'0.9':'1.1')+'vw,'+(fillRatio>0.7?'11':'14')+'px)';
  var cardPad=fillRatio>0.7?'0.4rem 0.6rem':fillRatio>0.4?'0.55rem 0.75rem':'0.75rem 0.9rem';

  state.players.forEach(function(p){
    var picks=state.picks.filter(function(pk){return pk.player===p;});
    var rc=el('div',{class:'p-roster-card'+(p===curPlayer?' on-clock':''),style:'padding:'+cardPad});
    rc.appendChild(el('p',{class:'p-roster-name',style:'font-size:'+nameFontSize+';margin:0 0 4px;padding-bottom:3px',text:p+' ('+picks.length+'/'+state.rosterSize+')'}));
    picks.forEach(function(pk,i){
      var isLatest=i===picks.length-1&&state.picks[state.picks.length-1]===pk;
      rc.appendChild(el('p',{class:'p-pick-item'+(isLatest?' fresh':''),style:'font-size:'+pickFontSize+';padding:0',text:(i+1)+'. '+pk.golfer+(pk.autodrafted?' \u26a1':pk.manual?' \u270e':'')}));
    });
    if(state.alts[p]){
      var altEl=el('p',{style:'font-size:'+pickFontSize+';color:var(--masters-gold-light);font-style:italic;padding:2px 0 0',text:'ALT: '+state.alts[p]});
      rc.appendChild(altEl);
    }
    rosters.appendChild(rc);
  });
  wrap.appendChild(rosters);

  // Exit button
  var exitBtn=el('button',{type:'button',class:'p-exit-btn',text:'\u2715 Exit TV Mode'});
  exitBtn.addEventListener('click',function(){presenterMode=false;render();});
  wrap.appendChild(exitBtn);
  app.appendChild(wrap);
}

function holeStyle(strokes,par){
  if(strokes===null||strokes===undefined||par===null) return '';
  var d=strokes-par;
  if(d<=-2) return 'sc-eagle';
  if(d===-1) return 'sc-birdie';
  if(d===0) return 'sc-par';
  if(d===1) return 'sc-bogey';
  return 'sc-double';
}

function renderBestBallScorecard(app,playerName){
  var g=state.games&&state.games.bestBall;
  if(!g||!g.enabled) return;
  var roundSet={};
  var allPicks=state.picks.filter(function(pk){return pk.player===playerName&&!isCut(pk.golfer);}).map(function(pk){return pk.golfer;});
  allPicks.forEach(function(golfer){
    var key=normName(golfer);
    Object.keys(liveHoleScores[key]||{}).forEach(function(r){roundSet[r]=true;});
    Object.keys(savedBBHistory[key]||{}).forEach(function(r){roundSet[r]=true;});
  });
  var roundNums=Object.keys(roundSet).map(Number).sort(function(a,b){return a-b;});
  if(!roundNums.length){
    var loadMsg=liveEventId?
      'Hole-by-hole data is being fetched — will populate shortly once the round is underway.':
      'Best ball data loads once ESPN has the current tournament active. Check back Thursday morning.';
    app.appendChild(el('p',{class:'small-muted',style:'margin:4px 0;font-style:italic',text:loadMsg}));
    return;
  }
  roundNums.forEach(function(rn){
    var eligible=getBBLineupForRound(playerName,rn);
    var isCustom=!!(state.bestBallLineups&&state.bestBallLineups[playerName]&&state.bestBallLineups[playerName][rn]&&state.bestBallLineups[playerName][rn].length);
    var card=el('div',{class:'card',style:'padding:0.75rem 0.6rem'});
    var cardHead=el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'});
    cardHead.appendChild(el('label',{class:'field-label',style:'margin:0',text:'Round '+rn+' \u2014 '+playerName+' (Best Ball)'}));
    cardHead.appendChild(el('span',{class:'small-muted',style:'font-size:11px',text:isCustom?'\uD83D\uDCCB Custom lineup':'Auto lineup'}));
    card.appendChild(cardHead);
    var golferRows=eligible.map(function(golfer){
      var hd=getHoleDataForRound(normName(golfer),rn);
      return{name:golfer,strokes:hd?hd.strokes:[],par:hd?hd.par:[]};
    });
    var parRow=[];
    for(var gi=0;gi<golferRows.length;gi++){if(golferRows[gi].par.length){parRow=golferRows[gi].par;break;}}
    if(!parRow.length) parRow=Array(18).fill(4);
    var maxHoles=Math.max.apply(null,golferRows.map(function(r){return r.strokes.length;})||[0]);
    var bbHoles=[];
    for(var h=0;h<maxHoles;h++){
      var hs=golferRows.map(function(r){return r.strokes[h];}).filter(function(s){return s!==undefined&&s!==null&&!isNaN(s);});
      bbHoles.push(hs.length?Math.min.apply(null,hs):null);
    }
    [{label:'Front 9',start:0,end:Math.min(9,maxHoles)},{label:'Back 9',start:9,end:maxHoles}].forEach(function(half){
      if(half.start>=maxHoles) return;
      var wrap=el('div',{class:'sc-wrap'});
      var t=el('table',{class:'sc-table'});
      var thead=el('thead');
      var hdr=el('tr');
      hdr.appendChild(el('th',{class:'sc-label sc-hole-head',text:half.label}));
      for(var h2=half.start;h2<half.end;h2++) hdr.appendChild(el('th',{class:'sc-hole-head',text:(h2+1)+''}));
      hdr.appendChild(el('th',{class:'sc-hole-head sc-out-in',text:half.end<=9?'OUT':'IN'}));
      if(half.end>9) hdr.appendChild(el('th',{class:'sc-hole-head',text:'TOT'}));
      thead.appendChild(hdr);t.appendChild(thead);
      var tbody=el('tbody');
      var pr=el('tr',{class:'sc-par-row'});
      pr.appendChild(el('td',{class:'sc-label',text:'Par'}));
      var halfPar=0;
      for(var h3=half.start;h3<half.end;h3++){var p2=parRow[h3]||4;halfPar+=p2;pr.appendChild(el('td',{text:p2+''}));}
      pr.appendChild(el('td',{class:'sc-out-in',text:halfPar+''}));
      if(half.end>9){var totPar=parRow.slice(0,18).reduce(function(s,v){return s+(v||4);},0);pr.appendChild(el('td',{text:totPar+''}));}
      tbody.appendChild(pr);
      golferRows.forEach(function(gr){
        var row=el('tr');
        row.appendChild(el('td',{class:'sc-label',text:gr.name.split(' ').pop()}));
        var halfTotal=0;
        for(var h4=half.start;h4<half.end;h4++){
          var s=gr.strokes[h4];var p3=parRow[h4]||4;
          if(s!==null&&s!==undefined) halfTotal+=s;
          var cls=s!==null&&s!==undefined?holeStyle(s,p3):'';
          var td=el('td');
          if(s!==null&&s!==undefined){td.appendChild(el('span',{class:'sc-ball '+(cls||''),text:s+''}));}
          else{td.textContent='\u2014';}
          row.appendChild(td);
        }
        row.appendChild(el('td',{class:'sc-out-in',text:halfTotal?halfTotal+'':'\u2014'}));
        if(half.end>9){var ft=gr.strokes.slice(0,9).reduce(function(s,v){return s+(v||0);},0);row.appendChild(el('td',{text:(ft&&halfTotal)?(ft+halfTotal)+'':'\u2014'}));}
        tbody.appendChild(row);
      });
      var bbr=el('tr',{class:'sc-bb-row'});
      bbr.appendChild(el('td',{class:'sc-label',text:'BEST BALL'}));
      var bbHT=0;
      for(var h5=half.start;h5<half.end;h5++){
        var bbs=bbHoles[h5];var p4=parRow[h5]||4;
        if(bbs!==null) bbHT+=bbs;
        var td2=el('td');
        if(bbs!==null){td2.appendChild(el('span',{class:'sc-ball '+(bbs!==null?holeStyle(bbs,p4):''),text:bbs+''}));}
        else{td2.textContent='\u2014';}
        bbr.appendChild(td2);
      }
      bbr.appendChild(el('td',{class:'sc-out-in',text:bbHT?bbHT+'':'\u2014'}));
      if(half.end>9){var bbF=bbHoles.slice(0,9).reduce(function(s,v){return s+(v||0);},0);bbr.appendChild(el('td',{text:(bbF&&bbHT)?(bbF+bbHT)+'':'\u2014'}));}
      tbody.appendChild(bbr);
      t.appendChild(tbody);wrap.appendChild(t);card.appendChild(wrap);
    });
    app.appendChild(card);
  });
}

    .sort(function(a,b){
      if(a.cut&&!b.cut) return 1;if(!a.cut&&b.cut) return -1;

    });
  var manCard=el('div',{class:'card'});

    nameLine.appendChild(el('span',{class:x.cut?'cut-name':'',text:x.golfer}));
    var os=el('span',{style:'font-size:11px;color:var(--ink-soft)'});os.textContent='('+owner+')';

function parseTodayScore(normKey){
  var d=liveDetails[normKey]||{};
  var raw=(d.todayRaw||'').trim();
  if(raw===''||raw==='-') return null;
  if(raw==='E') return 0;
  var n=parseInt(raw,10);
  return isNaN(n)?null:n;
}

function getBetScores(ch){
  var fk=normName(ch.fromGolfer),tk=normName(ch.toGolfer);
  var fs,ts;
  if(ch.type==='round'){
    fs=parseTodayScore(fk); ts=parseTodayScore(tk);
  }else if(ch.type==='remaining'){
    // Delta from score at acceptance — whoever improves more wins
    if(ch.fromStartScore===undefined||ch.fromStartScore===null||ch.toStartScore===undefined||ch.toStartScore===null){return{fs:null,ts:null};}
    var fCur=liveScores.hasOwnProperty(fk)?liveScores[fk]:null;
    var tCur=liveScores.hasOwnProperty(tk)?liveScores[tk]:null;
    if(fCur===null||tCur===null) return{fs:null,ts:null};
    fs=fCur-ch.fromStartScore; ts=tCur-ch.toStartScore;
  }else{
    // 'tournament' (legacy) — full tournament total
    fs=liveScores.hasOwnProperty(fk)?liveScores[fk]:null;
    ts=liveScores.hasOwnProperty(tk)?liveScores[tk]:null;
  }
  return{fs:fs,ts:ts};
}

function getBetLeader(ch){
  if(ch.winner) return ch.winner; // permanently settled — ignore live scores
  var s=getBetScores(ch);
  if(s.fs===null||s.ts===null) return null;
  if(s.fs<s.ts) return 'from';
  if(s.ts<s.fs) return 'to';
  return 'push';
}

      state.challenges.push({
